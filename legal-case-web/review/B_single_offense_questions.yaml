# 單一罪名核心事實確認問句（無混淆爭點，固定客觀構成事實用）
# 生成日期：2026-10-15
# 原則：底層事實提取，全形問號，純中文，無法律術語
- case_id: SINGLE-001
  pair_id: SINGLE_THEFT
  offense: 單純竊盜
  legal_issue: 確認未經同意、拿取動作、物品去向
  neutral_questions:
  - 你是在什麼時間、什麼地點拿走這個東西的？當時東西是放在哪裡？
  - 你拿走之前，有沒有問過東西的主人？主人當時知不知道你要拿？
  - 你拿的時候有沒有用工具，例如撬開、剪斷或翻牆？東西後來被你放到哪裡去了？
  - 你為什麼要拿這個東西？是自己要用、拿去賣，還是其他原因？
- case_id: SINGLE-002
  pair_id: SINGLE_ASSAULT
  offense: 單純傷害
  legal_issue: 確認起因、器具、攻擊部位、受傷結果
  neutral_questions:
  - 你們是為了什麼事情吵起來的？是誰先動手的？
  - 你動手的時候，手上有沒有拿東西？如果有，是什麼，是隨手拿的還是事先準備的？
  - 你打到對方身體的哪些地方？打了幾下？
  - 對方受傷之後有沒有去醫院？傷在哪裡，有沒有開診斷證明？
- case_id: SINGLE-003
  pair_id: SINGLE_FORGERY
  offense: 單純偽造文書
  legal_issue: 確認簽名真實性與有無授權
  neutral_questions:
  - 這份文件上面的簽名或印章，是你自己簽的、蓋的嗎？如果不是，是誰弄上去的？
  - 你在簽名或蓋章之前，有沒有問過本人同不同意？對方是當面答應，還是你事後才告知的？
  - 這份文件是做什麼用的？你把它交給了誰，對方拿去辦了什麼事？
  - 文件上面的名字、金額或日期，有沒有哪些是你自己加上去或改過的？
- case_id: SINGLE-004
  pair_id: SINGLE_THREAT
  offense: 單純恐嚇
  legal_issue: 確認言詞動作、傳達管道、對方感受
  neutral_questions:
  - 你當時對對方說了什麼話，或做了什麼動作？原話還記得嗎？
  - 你是當面講的、打電話講的，還是用訊息、網路留言傳的？
  - 對方聽到之後有什麼反應？有沒有哭、發抖、報警，或跟你說他很害怕？
  - 你講這些話，是因為跟對方有什麼糾紛？你們之前認不認識？
