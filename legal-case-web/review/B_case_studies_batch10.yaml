- case_id: CASE-B10-001
  pair_id: PAIR-047
  source:
    document_type: 判決
    court: 臺灣高等法院高雄分院
    case_number: 115年度上訴字第1158號
    judgment_date: '2026-10-08'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=KSHM,115,上訴,1158,20261008,1
    full_text_verified: true
    relevant_paragraphs:
    - 被告辯稱受告知帳戶供博奕集團使用，主觀上無三人以上共同詐欺取財之犯意聯絡...然上游已明言款項為騙來贓款需斷金流洗淨，被告收購帳戶、指示提款、持卡提款上繳，且曾承認部分共同詐欺犯行...所為係三人以上共同詐欺取財之正犯，而非僅幫助詐欺...上訴駁回...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 被告加入詐欺集團，收購他人帳戶、指示他人提款、持卡提款上繳
    - 上游明言款項為騙來贓款需斷金流洗淨
    - 被告辯稱誤認博奕款項、僅幫助，前後供述不一
    - 追加起訴認幫助詐欺幫助洗錢，法院認構成共同詐欺取財及洗錢正犯
    - 論處多罪，應執行有期徒刑4年2月，上訴駁回
    disputed:
    - 是否具共同詐欺之犯意聯絡，抑或僅幫助故意
    unknown: []
    source_attribution:
    - 來源：臺灣高等法院高雄分院115年度上訴字第1158號刑事判決
  legal_analysis:
    candidate_a:
      name: 幫助詐欺
      applicable_elements:
      - 明知他人犯罪而施以助力使其易於實行
      - 無共同犯意聯絡及行為分擔
      supporting_facts:
      - 若僅誤信博奕款項、偶然提供帳戶，即屬之
      contrary_facts:
      - 明知騙來贓款、收購帳戶、指示提款、分工上繳 → 非單純幫助
    candidate_b:
      name: 詐欺共犯
      applicable_elements:
      - 與正犯間有犯意聯絡
      - 參與分擔構成要件行為
      supporting_facts:
      - 知悉贓款需洗淨、收購帳戶指示提款上繳、曾承認部分犯行
      - 加入集團擔任車手頭等角色分工
      contrary_facts:
      - 無
  distinction_facts:
  - 關鍵在知情程度＋參與深度：是否知悉款項為詐騙贓款、有無收購指揮提款等分工
  - 僅提供帳戶不知贓款 → 幫助；知贓款並參與收購提款上繳鏈條 → 共同正犯
  - 前後供述是否一致、有無承認部分犯行為重要佐證
  neutral_questions:
  - 對方跟你要帳戶的時候，有沒有說這些錢是怎麼來的？你當時怎麼理解的？
  - 除了交出帳戶，你還有沒有幫忙收別人的帳戶、叫別人去領錢，或把領到的錢再交上去？
  - 你跟對方認識多久？平常都用什麼方式聯絡，見過面嗎？
  - 你從這件事裡面有沒有拿到錢？大約多少，是固定的還是按次給的？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-047，臺灣高等法院高雄分院115年度上訴字第1158號
- case_id: CASE-B10-002
  pair_id: PAIR-048
  source:
    document_type: 判決
    court: 臺灣高等法院臺中分院
    case_number: 115年度上訴字第891號
    judgment_date: '2026-10-08'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TCHM,115,上訴,891,20261008,1
    full_text_verified: true
    relevant_paragraphs:
    - 被告前置背信出售土地確定，事後以價金匯款支付配偶購買不動產...須證明主觀上有掩飾隱匿不法所得之洗錢意思...被告認告訴人已分得家產，否認背信尚非無據；配偶匯款無現金人頭斷點，難認妨礙追查...難認出於洗錢意思，洗錢部分無罪...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 被告前置背信出售土地犯行確定（另案）
    - 被告分3次以售地價金匯款支付配偶購買不動產價金
    - 匯款時間在背信起訴及民事判決前，被告主觀認告訴人已分得家產
    - 金流為配偶間匯款，無現金人頭斷點，偵查機關輕易可知悉
    - 法院認無從證明洗錢意思，洗錢部分無罪
    disputed:
    - 匯款購屋是否出於掩飾隱匿之洗錢意思
    unknown: []
    source_attribution:
    - 來源：臺灣高等法院臺中分院115年度上訴字第891號刑事判決
  legal_analysis:
    candidate_a:
      name: 洗錢
      applicable_elements:
      - 明知為前置犯罪所得
      - 出於掩飾隱匿去向之獨立意思而移轉處分
      supporting_facts:
      - 若以現金人頭製造斷點妨礙追查即該當
      contrary_facts:
      - 配偶匯款透明無斷點、自認無背信，主觀洗錢意思存疑 → 無罪
    candidate_b:
      name: 前置犯罪
      applicable_elements:
      - 實行背信詐欺竊盜等取得財物
      - 事後處分財物為犯罪之當然延伸
      supporting_facts:
      - 背信出售土地確定，價金匯款購屋為事後處分
      - 無獨立掩飾故意即僅論前置犯罪
      contrary_facts:
      - 無
  distinction_facts:
  - 關鍵在獨立洗錢意思：有無掩飾隱匿去向、妨礙追查之目的與手法
  - 透明匯款、配偶可查、無斷點 → 僅前置犯罪之延伸，不另論洗錢
  - 現金人頭、多層轉帳、虛擬貨幣 → 獨立洗錢故意
  neutral_questions:
  - 你拿到這筆錢之後，是直接拿去買東西繳錢，還是先轉給別人再轉回來？
  - 錢轉出去的時候，是用你自己的名字匯款，還是用別人的名字或領現金？
  - 你這樣轉來轉去，是為了讓人查不到錢從哪裡來，還是只是方便付款？
  - 你轉錢的時候，知不知道這筆錢是從犯罪來的？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-048，臺灣高等法院臺中分院115年度上訴字第891號
- case_id: CASE-B10-003
  pair_id: PAIR-049
  source:
    document_type: 判決
    court: 臺灣高等法院臺中分院
    case_number: 108年度上訴字第746號
    judgment_date: '2019-12-12'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TCHM,108,上訴,746,20191212,1
    full_text_verified: true
    relevant_paragraphs:
    - 被告未經同意擅自在他土地鋪設水泥，自屬竊占行為...水保法第32條係竊佔罪之特別規定，擅自占用公私有山坡地當然含有竊佔性質...須明知無法律上權利而對他人持有之不動產擅自墾殖占用開發使用始成立...民事無權占有判斷標準與刑事竊占構成要件本即不同...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 被告未經同意在他1893地號土地鋪設水泥15平方公尺
    - 被告明知界址（鑑界在場、地政告知、前手提醒），辯稱誤認水保範圍不可採
    - 民事判決認定騰空101平方公尺，刑事依勘驗認定15平方公尺，標準不同互不受拘束
    - 法院論處竊占及水保法罪責
    disputed:
    - 鋪設範圍及是否明知越界
    unknown: []
    source_attribution:
    - 來源：臺灣高等法院臺中分院108年度上訴字第746號刑事判決
  legal_analysis:
    candidate_a:
      name: 竊占
      applicable_elements:
      - 意圖為自己或第三人不法之利益
      - 竊取他人之不動產（占用開發使用）
      - 明知無法律上權利
      supporting_facts:
      - 明知界址仍越界鋪設水泥占用
      - 無權源擅自使用他人土地
      contrary_facts:
      - 若真不知界址而誤占，即無故意
    candidate_b:
      name: 竊盜
      applicable_elements:
      - 竊取他人之動產
      - 破壞持有建立新持有
      supporting_facts:
      - 若取走可移動之物即屬之
      contrary_facts:
      - 本案客體為土地，以鋪設附著方式占用，非搬走動產 → 竊占而非竊盜
  distinction_facts:
  - 關鍵在客體：動產搬走 → 竊盜；不動產占用附著利用 → 竊占
  - 竊占以鋪設興建墾殖等方式將土地納入自己使用，不以搬移為必要
  - 明知界址仍越界為故意核心；民事無權占有與刑事竊占有別
  neutral_questions:
  - 你使用的這塊土地或房間，是你自己的還是別人的？有沒有租約或權狀可以證明？
  - 你在上面鋪水泥、蓋東西之前，有沒有先量過界線或問過地政？知不知道界線在哪裡？
  - 你蓋好之後，原來的人還進得去、用得到那塊地方嗎？
  - 你是把東西搬走帶回家，還是直接在別人的地上蓋、鋪、種東西自己用？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-049，臺灣高等法院臺中分院108年度上訴字第746號
- case_id: CASE-B10-004
  pair_id: PAIR-050
  source:
    document_type: 判決
    court: 臺灣臺中地方法院
    case_number: 113年度易字第4415號
    judgment_date: '2026-09-29'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TCDM,113,易,4415,20260929,2
    full_text_verified: true
    relevant_paragraphs:
    - 背信罪為一般性違背任務之犯罪...為他人處理事務之人，若違背任務將持有之物侵占或以詐術使人交付財物，除成立侵占或詐欺罪外無依背信處斷餘地；但以侵占詐欺以外之方法違背任務損害本人利益者，並非當然可置背信於不論...被告受託處理不動產買賣，將應轉交款項侵占入己成立業務侵占，又以抵銷個人債務方式違背任務成立背信罪，想像競合從一重論處...[截斷]
  case_status:
    procedural_level: 第一審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 被告受告訴人授權代表處理不動產買賣，約定服務費對半分配
    - 被告將應轉交告訴人之12萬元現金侵占入己
    - 被告另將應轉交之3筆款項用以抵銷個人積欠債務，違背任務
    - 法院論處業務侵占罪及背信罪，想像競合從一重
    disputed: []
    unknown: []
    source_attribution:
    - 來源：臺灣臺中地方法院113年度易字第4415號刑事判決
  legal_analysis:
    candidate_a:
      name: 詐欺
      applicable_elements:
      - 施用詐術使人陷於錯誤而交付財物
      - 取得財物所有
      supporting_facts:
      - 若以詐術騙取交付即屬之，另論詐欺不論背信
      contrary_facts:
      - 本案為侵占應轉交款項及抵銷債務，非施詐術騙取
    candidate_b:
      name: 背信
      applicable_elements:
      - 為他人處理事務之受任人身分
      - 以侵占詐欺以外之方法違背任務
      - 致本人財產損害
      supporting_facts:
      - 受託處理買賣之房仲身分
      - 以抵銷個人債務方式違背轉交任務，損害本人利益
      contrary_facts:
      - 以侵占詐術方法部分另成立侵占罪
  distinction_facts:
  - 關鍵在方法：以侵占或詐術取得財物 → 侵占詐欺罪；以其他方法違背任務 → 背信罪
  - 背信為一般性補充規定，有委任關係＋違背任務＋損害即成立
  - 本案同一受託關係衍生兩罪想像競合，為方法區分最佳實證
  neutral_questions:
  - 對方請你幫忙處理事情的時候，有沒有說好你可以做哪些事、不能做哪些事？
  - 那些錢本來應該交給誰？你後來把錢拿去做了什麼用？
  - 你是騙對方把錢交給你，還是對方本來就把錢放在你這裡請你轉交？
  - 你拿這些錢去還自己的債之前，有沒有先問過對方同不同意？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-050，臺灣臺中地方法院113年度易字第4415號
