# 修正原則：
# 1. 繼承 v3：剔除純身分加重/法條競合，保留保護法益重疊之真爭點。
# 2. 新增 v4：擴充「刑法 vs 社維法」、「聚眾」、「槍砲」之第一線執法高頻界分。
