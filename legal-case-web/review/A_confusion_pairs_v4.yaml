# === 以下為 v4 新增：刑法 vs 社維法 / 聚眾 / 槍砲 ===

pair_id: PAIR-038
candidate_a: 公然侮辱/誹謗 (刑法)
candidate_b: 加害名譽/散布謠言 (社維法 §63)
legal_issue: 場所公然性＋言論內容事實：是否指涉具體事實？情節是否達刑事告訴之必要，抑或僅為抽象謾罵/情緒宣洩？
normalization_status: verified

pair_id: PAIR-039
candidate_a: 賭博罪 (刑法 §266)
candidate_b: 賭博 (社維法 §84)
legal_issue: 場所＋賭注事實：是否為公共場所/公眾得出入場所？賭注是否為現金/高價物，抑或僅為飲料/小玩具等暫時娛樂之物？
normalization_status: verified

pair_id: PAIR-040
candidate_a: 公然猥褻 (刑法 §234)
candidate_b: 妨害風化 (社維法 §81)
legal_issue: 行為＋場所事實：是否足以引起一般人羞恥厭惡感？場所是否達不特定人共見共聞之公然程度？
normalization_status: verified

pair_id: PAIR-041
candidate_a: 妨害公務 (刑法 §135)
candidate_b: 妨害公務 (社維法 §85)
legal_issue: 手段事實：對公務員之言詞/行動，是否已達強暴脅迫（如推擠毆打），抑或僅為顯然不當言詞/謊報/不聽勸阻？
normalization_status: verified

pair_id: PAIR-042
candidate_a: 傷害/鬥毆 (刑法 §277/283)
candidate_b: 加暴行於人/互相鬥毆 (社維法 §87)
legal_issue: 結果＋行為事實：是否造成生理機能損傷（需驗傷），抑或僅為未達傷害之暴行（如推搡潑水）或單純互毆？
normalization_status: verified

pair_id: PAIR-043
candidate_a: 毀損 (刑法 §354)
candidate_b: 污損招牌/擅自塗鴉 (社維法 §90)
legal_issue: 客體狀態＋復原事實：是否導致物品喪失主要效用（如砸爛/潑漆無法清除），抑或僅為表面污損且可輕易復原（如可撕除/擦拭）？
normalization_status: verified

pair_id: PAIR-044
candidate_a: 聚眾鬥毆/妨害秩序 (刑法 §283/149)
candidate_b: 聚眾鬥毆/加暴行 (社維法 §87)
legal_issue: 規模＋意圖事實：是否達刑法聚眾鬥毆之規模（聚集多人/意圖），或僅為社維法之偶發互毆/加暴行？
normalization_status: verified

pair_id: PAIR-045
candidate_a: 持有具殺傷力槍枝 (槍砲條例)
candidate_b: 攜帶具有殺傷力之器械/空氣槍 (社維法 §63)
legal_issue: 客體性質＋主觀認知事實：物品是否經鑑定具殺傷力？行為人主觀上是否明知為真槍/致命器械，抑或僅認為是玩具/空氣槍/日常工具？
normalization_status: verified

pair_id: PAIR-046
candidate_a: 製造/改造槍枝 (槍砲條例)
candidate_b: 持有槍枝 (槍砲條例)
legal_issue: 行為參與程度事實：是否實際參與組裝/改造/車床加工等核心製造行為，抑或僅為單純取得並保有？
normalization_status: verified
