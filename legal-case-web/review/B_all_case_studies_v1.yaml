    full_text_verified: true
    relevant_paragraphs:
    - 殺人與傷害致死之區別，應以加害人有無殺意為斷；而殺人決意乃行為人之主觀意念，此主觀決意，透過客觀行為外顯，應綜合行為人行為之動機、下手之輕重、次數、兇器種類、攻擊之部位，及被害人傷勢是否致命、傷勢多寡、嚴重程度如何等，就外在之一切證據，詳查審認...[截斷]
