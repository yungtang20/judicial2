    - 被告未經前配偶A女同意，無故攝錄洗澡裸睡性交等性影像影片
    - 被告另以網路發表貶低人格言論、張貼個資照片、恐嚇，分論併罰
    - 公訴意旨另指被告上傳影片至抖音臉書遊戲平台供人觀覽，涉散布猥褻影像及散布性影像罪
    - 法院認僅LINE私訊傳送A女1人，無傳送他人或公開置於不特定多數人可得瀏覽狀態，與散布要件不符，不另無罪諭知
    disputed:
    - 被告是否上傳影片至公開平台供人觀覽
    unknown: []
    source_attribution:
    - 來源：臺灣桃園地方法院114年度訴字第1162號刑事判決
  legal_analysis:
    candidate_a:
      name: 散布猥褻物品
      applicable_elements:
      - 散布猥褻之文字圖畫影音等物品
      - 傳播於不特定人或多數人使大眾周知
      supporting_facts:
      - 若上傳影片至公開平台供人觀覽即該當
      contrary_facts:
      - 僅LINE私訊1人，無公開於不特定多數人可得瀏覽狀態，不符散布要件
    candidate_b:
      name: 散布性影像
      applicable_elements:
      - 未經同意無故散布他人性影像供人觀覽
      - 傳播於不特定人或多數人
      supporting_facts:
      - 若上傳至公開平台即該當319之3
      contrary_facts:
      - 同樣因僅私訊1人，不符散布要件
      - 攝錄行為本身另成立319之1，與散布為不同行為
  distinction_facts:
  - 兩罪散布要件相同：均須傳播於不特定人或多數人使大眾周知，私訊特定1人不是散布
  - 客體不同：235為猥褻物品（不以被害人性隱私為必要），319之3為特定被害人之性影像（侵害性隱私）
  - 本案同一影片同被訴兩罪，法院以散布要件不符同判不另無罪，顯示兩罪在此共用散布定義
  - 攝錄（319之1）與散布（319之3）為不同行為，應分別評價
  neutral_questions:
  - 這支影片你是只傳給某一個特定的人，還是放到很多人都看得到的地方，例如公開社團或動態？
  - 如果是放到網路上，是放在哪個平台？大約有多少人可以看到？
  - 影片裡的人是誰？拍攝的時候對方知不知道、答不答應？
  - 你把影片傳出去，是想給特定的人看，還是希望越多人看到越好？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-025，臺灣桃園地方法院114年度訴字第1162號
- case_id: CASE-B8-006
  pair_id: PAIR-025
  source:
    document_type: 判決
    court: 臺灣桃園地方法院
    case_number: 114年度訴字第1357號
    judgment_date: '2026-07-21'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TYDM,114,訴,1357,20260721,1
    full_text_verified: true
    relevant_paragraphs:
    - 被告拍攝告訴人裸露身體照片係經告訴人同意所為，該照片即非屬刑法第319條之1所規範之性影像，則被告嗣後未經同意散布該照片，僅構成刑法第319條之3第1項之無故散布性影像罪，而非同條第2項之無故散布非法攝錄性影像罪...第319條之3第1項之罪須告訴乃論，告訴人撤回告訴，為不受理判決...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 被告與告訴人為男女朋友，交往期間經同意拍攝裸露身體照片
    - 被告嗣後未經同意上傳照片至臉書IG公然陳列供人觀覽，被告坦承
    - 法院認經同意拍攝之照片非319之1性影像，嗣後未經同意散布僅構成319之3第1項而非第2項
    - 兩罪均須告訴乃論，告訴人撤回告訴，諭知公訴不受理
    - 告訴人明知同意拍攝仍誣指未經同意拍攝，法院依職權告發誣告罪嫌
    disputed:
    - 無（被告坦承散布，告訴人證實同意拍攝）
    unknown: []
    source_attribution:
    - 來源：臺灣桃園地方法院114年度訴字第1357號刑事判決
  legal_analysis:
    candidate_a:
      name: 散布猥褻物品
      applicable_elements:
      - 散布猥褻物品於不特定多數人
      - 不以特定被害人性隱私為保護核心
      supporting_facts:
      - 若照片屬一般猥褻物品而非特定人性影像，可能適用
      contrary_facts:
      - 本案照片為特定告訴人之身體照片，侵害性隱私，應適用性影像專罪而非235
    candidate_b:
      name: 散布性影像
      applicable_elements:
      - 未經同意無故散布他人性影像
      - 經同意拍攝後未經同意散布 → 第1項；非法攝錄後散布 → 第2項加重
      - 須告訴乃論
      supporting_facts:
      - 經同意拍攝，嗣後未經同意上傳公開，構成第1項
      - 非法攝錄要件不該當，故非第2項
      - 告訴撤回 → 公訴不受理
      contrary_facts:
      - 無
  distinction_facts:
  - 性影像法內部分級：同意拍攝＋未經同意散布為第1項，非法攝錄＋散布為第2項加重，拍攝時同意與否決定適用項次
  - 與235之分工：特定人性隱私影像優先適用319之3專罪，而非235一般猥褻物品罪
  - 告訴乃論為性影像罪重要程序特徵，與告訴撤回效力連動
  - 與 CASE-B8-005 對照：B8-005 未達散布而不成立，B8-006 已公開散布而成立僅因撤告不受理，完整呈現散布罪之實體與程序面
  neutral_questions:
  - 這些照片當初拍的時候，對方有沒有親口答應讓你拍？
  - 後來你把照片放到臉書或IG之前，有沒有再問過對方同不同意公開？
  - 照片放在公開的地方大約多久？有多少人看過或留言？
  - 對方後來有沒有要求你刪掉？你是自己刪的還是對方動手刪的？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-025，臺灣桃園地方法院114年度訴字第1357號
- case_id: CASE-FINAL-001
  pair_id: PAIR-009
  source:
    document_type: 判決
    court: 臺灣高等法院
    case_number: 114年度上易字第226號
    judgment_date: '2025-05-14'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TPHM,114,上易,226,20250514,1
    full_text_verified: true
    relevant_paragraphs:
    - 王慶興意圖為自己不法之所有，基於竊盜犯意徒手竊取安全帽得手；黃金和明知安全帽為王慶興所竊贓物，仍基於收受贓物犯意，於使用完畢後攜回住處收受之...原判決撤銷，王慶興犯竊盜罪，黃金和犯收受贓物罪...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 王慶興於112年12月29日晚間徒手竊取機車上安全帽1頂得手，並搭乘黃金和機車離去
    - 黃金和明知安全帽為竊贓物，於使用完畢後攜回住處收受
    - 原審以使用竊盜為由均諭知無罪，經本院撤銷改判有罪
    - 安全帽已發還被害人
    disputed:
    - 是否具不法所有意圖及收受贓物犯意（被告辯稱借用及代為歸還）
    unknown: []
    source_attribution:
    - 來源：臺灣高等法院114年度上易字第226號刑事判決
  legal_analysis:
    candidate_a:
      name: 贓物
      applicable_elements:
      - 明知為前置財產犯罪之贓物
      - 收受、搬運、寄藏、故買或媒介
      supporting_facts:
      - 明知安全帽為竊贓物仍攜回住處收受
      - 論處收受贓物罪
      contrary_facts:
      - 若不知為贓物則不成立
    candidate_b:
      name: 前置犯罪
      applicable_elements:
      - 實行竊盜等財產犯罪取得財物
      - 破壞持有建立新持有
      supporting_facts:
      - 徒手竊取他人安全帽得手
      - 論處竊盜罪
      contrary_facts:
      - 若僅暫時使用即歸還且無不法所有意圖，可能屬使用竊盜而無罪
  distinction_facts:
  - 贓物罪以存在前置財產犯罪為前提：先有竊盜取得贓物，後有明知而收受
  - 同一安全帽衍生兩罪：竊取者成立前置犯罪，收受者成立贓物罪，行為人不同
  - 明知為贓物為贓物罪主觀核心；使用竊盜抗辯經法院駁回，確認不法所有意圖存在
  neutral_questions:
