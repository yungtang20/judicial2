    full_text_verified: true
    relevant_paragraphs:
    - 刑法第227條第1項及第3項之合意性交罪，自須未滿14歲或14歲以上未滿16歲之男女有同意性交之意思能力，且經其同意與行為人為性交者始足當之。倘欠缺意思能力或不同意，即與合意性交構成要件不符而不得論以該項之罪。未滿7歲之男女並無意思能力，自無從論以227條，應認已妨害其性自主意思自由而違反其意願，論以第222條第1項第2款加重違反意願性交罪...[截斷]
    - A女B女俱值稚齡，根本不知觸摸插入生殖器之意涵，未必有抗拒行為，不能解為默示同意，被告以手觸碰手指插入生殖器，自屬以違反意願之方法強制猥褻性交，強制猥褻低度行為為強制性交高度行為吸收...[截斷]
