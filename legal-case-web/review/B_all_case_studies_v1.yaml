  - 未滿7歲者並無意思能力，自無從論227，只能論222加重違反意願性交
  - 未抗拒不等於同意：稚齡被害人囿於年齡經驗未抗拒，不能解為默示同意
  - 強制猥褻低度行為為強制性交高度行為吸收，不另論罪
