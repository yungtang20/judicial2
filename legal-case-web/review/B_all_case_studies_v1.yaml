    - 顧懷祐於任期外仍實質掌握醒吾高中財務
    - 顧懷祐開立醒吾高中支票以擔保顧大義積欠債務
    - 檢察官起訴普通侵占，第二審變更論背信罪
    disputed:
    - 爭執背信與侵占的犯罪事實是否同一，是否允許變更起訴法條
    unknown: []
    source_attribution:
    - 來源：最高法院112年度台上字第2077號刑事判決
  legal_analysis:
