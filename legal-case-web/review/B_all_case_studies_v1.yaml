- case_id: CASE-B1-001
  pair_id: PAIR-002
  source:
    document_type: judgment
    court: 最高法院
    case_number: 112年度台上字第3817號
    judgment_date: '2023-09-28'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TPSM,112,台上,3817,20230928,1
    full_text_verified: true
    relevant_paragraphs:
    - 竊盜與詐欺取財，均為行為人基於不法所有意圖，破壞原持有人之持有而對於特定財物建立新的持有之犯罪行為，其區別乃在於行為人有無「違反原持有人之意思」而將財物移轉予行為人或第三人占有，如係違反原持有人之意思而為，但並無使用強盜、搶奪或恐嚇等方式者，即屬竊盜，若係使原持有人陷於錯誤而自願性交付財物予行為人，雖原持有人之交付意思因行為人之詐術施用而有瑕疵，但財物占有之移轉既源於原持有人之自願性交付，則屬詐欺。...[截斷]
  case_status:
    procedural_level: 第三審
    outcome: verified_via_webfetch
  facts:
    established:
    - 共同搖動/撞擊選物販賣機臺使商品掉落取物口
    - 未購買機臺保證取物商品以外部分
    disputed:
    - 被告主張僅詐欺取財(刑法第339條之1)
    unknown: []
    source_attribution:
    - B_case_studies_batch1.md Case for PAIR-002 (TPSM 112台上3817)
  legal_analysis:
    candidate_a:
      name: 竊盜
      applicable_elements:
      - 破壞原持有人持有
      - 建立新持有
      - 不法所有意圖
      - 違反原持有人之意思
      supporting_facts:
      - 直接/間接物理力取得
      - 收費設備未受詐而誤判
      contrary_facts:
      - 若 victim 陷於錯誤並自願交付
    candidate_b:
      name: 詐欺
      applicable_elements:
      - 使 victim 陷於錯誤
      - 自願交財物
      - 不法所有意圖
      supporting_facts:
      - victim 受詐 illusion 而交付
      contrary_facts:
      - 直接 physical force taking
  distinction_facts:
  - 取得財物時他人是否陷於錯誤並自願交出
  - 是否使用投射的假象 devices
  - 是否有物理力不經過 victim 意思
  neutral_questions:
  - 你取得該財物時，原持有人是否因為你的言語、行為或 devices而 believed 你已付款或有權取得，並由此主動將物品交給你？
  - 原持有人在交付時是否知道也理解自己的願意、是否能自由拒絕？
  - 你是否在取財後立刻離開而未讓原持有人事後有機會澄清？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-002 primary source TPSM 112台上3817 has explicit distinction.
- case_id: CASE-B1-002
  pair_id: PAIR-003
  source:
    document_type: judgment
    court: 臺灣高等法院高雄分院
    case_number: 109年度上訴字第1194號
    judgment_date: '2020-11-25'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=KSHM,109,上訴,1194,20201125,1
    full_text_verified: true
    relevant_paragraphs:
    - 以威嚇方法使人交付財物之強盜罪與恐嚇罪之區別，係以對被害人施用威嚇之程度為標準，如足以壓抑被害人之意思自由，至使不能抵抗而為財物之交付者，即屬強盜罪。...面向不法內涵相近但因構成要件或侵害法益程度不同而異其處罰之犯罪類型（例如竊盜與強盜等相類財產犯罪），倘行為人最初本於不法程度較輕之犯罪意思，嗣於著手前或犯罪過程中，客觀情事有所變更，當場改以實施不法程度較高或相同之罪者，應認行為人主觀犯意業已層升為較重之罪或變更原犯意，僅依該較重或變更後罪質相同之罪論擬。...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_webfetch
  facts:
    established:
    - 翻越圍牆進入住宅竊取財物
    - 本案著手後遭人發現形跡而 escalate
    - 持空氣槍/束帶脅迫成員限制行動
    disputed: []
    unknown: []
    source_attribution:
    - B_case_studies_batch1.md Case for PAIR-003 (KSHM 109上訴1194)
  legal_analysis:
    candidate_a:
      name: 竊盜
      applicable_elements:
      - ' SECRET/avoid detection 盜取 property'
      - without force
      supporting_facts:
      - ' initially quiet/undetected'
      - no victim present
      contrary_facts:
      - when detected, escalation to robbery
    candidate_b:
      name: 強盜
      applicable_elements:
      - ' use force/threat/boisterous extraction'
      - victim unable to resist
      supporting_facts:
      - ' victims restrained with zip-ties while brushed'
      contrary_facts:
      - if no detection/force element
  distinction_facts:
  - whether force/threat was used against victim at time of taking
  - whether victim's resistance was overcome
  - momentary escalation timing during theft
  neutral_questions:
  - 你在取得財物的過程中，是否有人發現你的行動？
  - 之後是否使用 force, threat, or equipment 封鎖 others to keep going, 或 merely to escape?
  - try 的 threat sufficient to make them unable to resist  during the taking?
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - Pair-003 source KSHM 109上訴1194 contains theft-to-robbery escalation rule.
- case_id: CASE-B1-003
  pair_id: PAIR-004
  source:
    document_type: judgment
    court: 臺灣高等法院
    case_number: 111年度上易字第1240號
    judgment_date: '2021-09-14'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TPHM,111,上易,1240,20220914,1
    full_text_verified: true
    relevant_paragraphs:
    - 基於竊盜之犯意...破壞被害所管領之自小客車車窗，進入車內竊取財物；復基於竊盜及毀損之犯意...破壞自小客車車窗玻璃，致令車窗玻璃不堪使用，足以生損害於被害人，並開啟車門進入車內竊取財物...（部分原文為想像競合犯處理，見下reasoning）
  case_status:
    procedural_level: 第二審
    outcome: verified_via_webfetch_reasoning_truncated
  facts:
    established:
    - 破壞被害自小客車玻璃進入車內竊取財物
    - 部分還 joined-theft (竊盜+毀損) with destruction charged jointly
    - ' imagining-combining for concurrent theft/destruction'
    disputed: []
    unknown: []
    source_attribution:
    - B_case_studies_batch1.md Case for PAIR-004 (TPHM 111上易1240)
  legal_analysis:
    candidate_a:
      name: 竊盜
      applicable_elements:
      - ' Intent to unlawfully possess'
      - taking of another's movable property
      supporting_facts:
      - blocked entry / taking property
      contrary_facts:
      - only damaged property without taking
    candidate_b:
      name: 毀損
      applicable_elements:
      - ' Damage/expendability without ownership intention'
      supporting_facts:
      - window glass destroyed beyond use
      - creation of damage
      contrary_facts:
      - if gl damage only to take other property
  distinction_facts:
  - only property or similar value is taken (or attempted) after damage
  - whether Window broken solely to get other thing or to destruct value
  - whether you took anything substantial from the Broken container
  neutral_questions:
  - 你破壞了 victim's vehicle window/lock with the purpose of entering to steal contents,
    or only to cause loss?
  - Did you take any property from the vehicle after breaking it in? If so, what and
    approximate value?
  - If you found nothing valuable inside and left, were the damage done only as a
    incidental consequence without intent to take anything?
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - TPHM 111上易1240 demonstrates combined pattern; full reasoning truncated (2000-char
      clip) in webfetch. Basic facts captured.
- case_id: CASE-B2-001
  pair_id: PAIR-005
  source:
    document_type: 判決
    court: 臺灣高等法院
    case_number: 108年度上易字第880號
    judgment_date: '2019-07-25'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TPHM,108,上易,880,20190725,1
    full_text_verified: true
    relevant_paragraphs:
    - 故「使用竊盜」與犯竊盜罪之後物歸原主之行為，主要差別在於：「使用竊盜」自始有無不法所有之意圖，因一時未能取得他人同意，暫時使用他人管領支配之物，事後即時歸還；「竊盜」則係意圖為自己或第三人不法之所有，破壞原持有人對於財物之持有支配關係，而建立新的持有支配關係，事後因某種原因，而歸還所竊取之物。兩者事後雖均有物歸原主之客觀行為，然就其是否自始即有不法所有之意圖，則迥然有別。...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_webfetch
  facts:
    established:
    - 被告為躲避另案查緝，取用被害人所有普通重型機車
    - 被告自承以備用鑰匙開啟電門後騎用，並將機車騎回原處
    - 告訴人與被害人均未同意該使用
    disputed:
    - 原審普通竊盜罪部分先判無罪，檢察官上訴
    - 被告主張只能成立使用竊盜，或未證明不法所有意圖
    unknown: []
    source_attribution:
    - 來源：臺灣高等法院108年度上易字第880號刑事判決
  legal_analysis:
    candidate_a:
      name: 竊盜
      applicable_elements:
      - 破壞他人持有
      - 建立自己持有
      - 不法所有意圖
      supporting_facts:
      - 被告認知法律上無合法權源，主觀上具有不法意圖
      - 將所竊機車作為另案竊盜工具，實際排除原權利人使用
      contrary_facts:
      - 使用時間短，事後歸還
    candidate_b:
      name: 使用竊盜
      applicable_elements:
      - 一時使用
      - 暫時取得他人管領支配之物
      - 事後即時歸還
      - 無不法所有意圖
      supporting_facts:
      - 因一時未能取得他人同意而暫時使用
      contrary_facts:
      - 涉及攸關權義或處分
      - 使用 prolonged
      - 財物耗損或隱含不法目的
      - 所有權人一般不會同意使用
  distinction_facts:
  - 是否自始具有不法所有意圖
  - 是否主觀上 intend 持續破壞原持有人持有支配關係
  - 僅是一時順路利用後歸返 是否仍成立竊盜
  - 事後歸還原物不阻 yet offense already committed
  neutral_questions:
  - 你把這台機車騎走之前，有沒有先問過車主能不能借用？當時車主人在哪裡？
  - 你騎走機車時，心裡原本打算用多久？是打算當天就還回去，還是沒有想過歸還的事？
  - 你把機車還回去的時候，車子跟騎走時相比有沒有損傷、缺油或多出里程？
  - 你騎走這台機車，是為了解決什麼急事？事後你是主動還車，還是被找到才交出來？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-005，臺灣高等法院108年度上易字第880號
- case_id: CASE-B2-002
  pair_id: PAIR-006
  source:
    document_type: 判決
    court: 最高法院
    case_number: 112年度台上字第2077號
    judgment_date: '2024-06-19'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TPSM,112,台上,2077,20240619,1
    full_text_verified: true
    relevant_paragraphs:
    - 不論是刑法第335條之普通侵占罪或第336條第2項之業務侵占罪，其與背信罪皆係以與被害人之內部信賴關係為前提，因違背該信賴關係而侵害被害人財產之犯罪。惟侵占罪係以取得個別財產為其本質，而背信罪則為侵害整體財產之犯罪。侵占罪之持有他人之物的原因，限於有「委託信賴關係」之情況（本院52年台上字第1418號刑事判決先例參照），故侵占罪成立時，雖其行為合於背信罪之構成要件，亦當論以侵占罪，而不應論以背信罪。...[截斷]
  case_status:
    procedural_level: 第三審
    outcome: verified_via_webfetch
  facts:
    established:
    - 顧大義曾任醒吾技術學院董事長，顧懷祐曾為醒吾高中董事長
    - 顧懷祐於任期外仍實質掌握醒吾高中財務
    - 顧懷祐開立醒吾高中支票以擔保顧大義積欠債務
    - 檢察官起訴普通侵占，第二審變更論背信罪
    disputed:
    - 爭執背信與侵占的犯罪事實是否同一，是否允許變更起訴法條
    unknown: []
    source_attribution:
    - 來源：最高法院112年度台上字第2077號刑事判決
  legal_analysis:
    candidate_a:
      name: 侵占
      applicable_elements:
      - 取他人管領之物
      - 建立新持有
      - 不法所有意圖
      supporting_facts:
      - 持有源自委託信賴關係
      - 影響一個 specific 持有財產
      contrary_facts:
      - 純粹管理違背，未涉及取得個別財產
    candidate_b:
      name: 背信
      applicable_elements:
      - 為他人處理事務
      - 違背任務
      - 致本人財產損害
      supporting_facts:
      - 負責 學校財務
      - 未授權 不當 money flow of personal debts
      contrary_facts:
      - 個別財產取得 sequence
  distinction_facts:
  - 該財物是否源自 委託 trust 持有關係
  - 違背任務是否超越 個別財產 conversion and affect 整體 finance
  neutral_questions:
  - 你當時在學校擔任什麼職務？開立支票這件事，是你職務範圍內本來就可以做的嗎？
  - 你開出去的這張支票，錢最後是流向哪一個特定的對象或帳戶？這筆錢原本應該用在什麼地方？
  - 除了這張支票之外，學校整體的錢財或帳目是否也因此出現短缺或混亂？
  - 你做這件事之前，有沒有跟學校其他有權決定的人商量或取得同意？
  alternative_outcomes:
    both_possible: true
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-006，最高法院112年度台上字第2077號
- case_id: CASE-B2-003
  pair_id: PAIR-007
  source:
    document_type: 判決
    court: 臺灣高等法院高雄分院
    case_number: 115年度上訴字第396號
    judgment_date: '2026-07-28'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=KSHM,115,上訴,396,20260728,1
    full_text_verified: true
    relevant_paragraphs:
    - 嗣該犯罪者取得幣託帳戶資料後，即意圖為自己不法所有，基於詐欺取財之犯意，以如附表編號1至3、5至6所示方式，對各該編號所示之人施用詐術，致其等均陷於錯誤，於各該編號所示時間，以超商代碼繳費方式，加值金額至幣託帳戶；另意圖為自己不法所有，基於恐嚇取財之犯意，以如附表編號4、7至10所示方式，恐嚇各該編號所示之人，致其等心生畏懼，於各該編號所示時間，以超商代碼繳費方式，加值金額至幣託帳戶。...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_webfetch
  facts:
    established:
    - 犯罪者 induce victims to pay through online interaction
    - some victims pay because of threat release private images
    - all victims paid through convenience store machines
    disputed:
    - Some cases initially labeled fraud, then determined as extortion
    - Scope of participant involvement and helper awareness unresolved
    unknown: []
    source_attribution:
    - 來源：臺灣高等法院高雄分院115年度上訴字第396號刑事判決
  legal_analysis:
    candidate_a:
      name: 詐欺
      applicable_elements:
      - 詐術使對方發生錯誤
      - due to 錯誤而 voluntary delivery
      - unlawfully intent to obtain property
      supporting_facts:
      - transfer explained by created belief or excuse
      contrary_facts:
      - property transfer caused by terror of threatened exposure
    candidate_b:
      name: 恐嚇取財
      applicable_elements:
      - 對他人施加威脅
      - 他人因威脅而畏懼
      - caused delivery despite lack duty
      supporting_facts:
      - threat release private visual content
      - victims know no lawful basis but pay anyway due fear
      contrary_facts:
      - mere mistaken belief rather than terror
  distinction_facts:
  - decisive mental state whether error or fear
  - whether delivery arose from explanation believed false
  - threaten 若 removing  payment是否 still occurs
  neutral_questions:
  - 對方當時跟你說了什麼話或傳了什麼訊息，讓你相信不付錢就會有不好的事情發生？還記得內容嗎？
  - 你去超商付錢的時候，心裡比較相信對方說的是真的，還是比較害怕對方會把你的事情公開？
  - 如果對方從頭到尾都沒有威脅你，你還會去超商付這筆錢嗎？
  - 付錢之前，對方有沒有給你時間考慮或跟家人商量？有的話大約多久？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-007，臺灣高等法院高雄分院115年度上訴字第396號
