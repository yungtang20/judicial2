  - 公訴須就性交與猥褻分別舉證，不能以猥褻證據證明性交，反之亦然
  - 本案兩罪並列起訴但均因補強不足無罪，顯示兩罪證據應分別評價
  - 與 CASE-B7-004 有罪案例對照，凸顯行為態樣認定與證據充分性之關鍵
