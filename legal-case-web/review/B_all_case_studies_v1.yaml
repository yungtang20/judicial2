      name: 偽證
      applicable_elements:
      - 經具結後為虛偽陳述
      - 就案情重要關係事項為足以影響偵查審判之陳述
      - 具直接故意，明知不實仍故意為之
      supporting_facts:
      - 被告經命供前具結後為相同虛偽陳述
