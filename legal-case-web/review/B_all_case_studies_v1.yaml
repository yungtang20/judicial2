    established:
    - 被告與告訴人為兄妹，具家暴法第3條第4款家庭成員關係
    - 因口角持紙箱丟擲、拉扯頭髮手臂致摔倒，受多處挫傷擦傷
    - 法院論處刑法傷害罪拘役40日
    disputed: []
    unknown: []
