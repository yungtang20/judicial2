    candidate_a:
      name: 強制性交
      applicable_elements:
      - 以強暴脅迫恐嚇催眠術或其他違反意願之方法
      - 而為性交行為（性器接合、口肛交等，刑法第10條第5項）
      supporting_facts:
      - 公訴意旨指被告對甲女強制性交5次、對乙女強制性交
      contrary_facts:
      - 僅有告訴人單一指訴且前後不一，無其他補強證據
      - 法院認未達確信程度，諭知無罪
    candidate_b:
      name: 強制猥褻
      applicable_elements:
      - 以強暴脅迫等違反意願之方法
      - 而為性交以外足以興奮或滿足性慾之色情行為
      supporting_facts:
      - 公訴意旨指被告對乙女強制猥褻
      contrary_facts:
      - 同樣因證據不足諭知無罪
      - 猥褻與性交之行為態樣不同，須分別舉證證明
