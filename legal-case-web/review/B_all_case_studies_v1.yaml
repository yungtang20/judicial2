      name: 恐嚇
      applicable_elements:
      - 以加害生命身體自由名譽財產之事恐嚇他人
      - 使人心生畏懼，致生危害於安全
      - 未達至使人不能抗拒之程度
      supporting_facts:
      - 以剝奪自由、言語脅迫等方式使被害人心生畏懼
      - 被害人仍保有一定意思決定自由，事後得以指訴
      - 手段未達壓制反抗至不能抗拒
      contrary_facts:
      - 若手段已達使人不能抗拒並取財，即升級為強盜
    candidate_b:
      name: 強盜
      applicable_elements:
      - 意圖為自己或第三人不法所有
      - 以強暴脅迫等至使人不能抗拒
      - 取他人之物或使其交付
      supporting_facts:
      - 公訴意旨指稱取走現金手機車鑰匙、逼問密碼
      contrary_facts:
      - 取手機難認有不法所有意圖，係為避免求救
      - 證人證述不一，取財事實存疑，未達不能抗拒之證明
      - 法院認不能證明強盜，僅成立恐嚇取財及妨害自由
  distinction_facts:
  - 核心差異在脅迫程度：強盜須達至使人不能抗拒，恐嚇僅使人心生畏懼但仍有意思自由
  - 手段未達不能抗拒程度，或非出於不法所有意圖，均不能成立強盜罪
  - 本案雖有人多勢眾、剝奪自由、言語脅迫，仍僅認恐嚇取財而非強盜
  - 取手機為斷絕求救 vs 取財歸己，前者無不法所有意圖
  neutral_questions:
  - 對方當時是否已完全無法反抗、無法求救或逃離？
  - 你使用之強暴脅迫手段，是否已壓制對方至不能抗拒？
  - 你取走財物是為自己所有，還是為阻止對方求救或另有目的？
  - 對方是出於畏懼而交付，還是已喪失反抗能力任你取走？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-016，臺灣高等法院114年度上訴字第5394號
- case_id: CASE-B6-001
  pair_id: PAIR-017
  source:
    document_type: 判決
