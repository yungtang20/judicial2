  - 兩罪均須直接故意：出於誤會、懷疑、認知差異而無積極證據證明故意虛構者，兩罪均不成立
  - 告訴人嗣後獲不起訴，不影響偽證誣告故意之判斷，重點在申告及具結當時主觀是否明知不實
