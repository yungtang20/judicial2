  legal_analysis:
    candidate_a:
      name: 傷害
      applicable_elements:
      - 有傷害故意（直接或間接，知與欲相符）
      - 行為時主觀上預見且容任結果發生
      supporting_facts:
      - 以行為人個人之知與欲為斷，依表現及客觀證據個案探究
      - 本案類推：須證明行為人主觀認識構成要件並容任發生
      contrary_facts:
      - 若僅能證明事後客觀可預見，不足成立故意
    candidate_b:
      name: 過失傷害
      applicable_elements:
      - 無傷害故意，主觀上無預見
      - 違反一般合理正常人之注意義務
      - 應注意、能注意而不注意
      supporting_facts:
      - 注意義務求諸一般合理正常人標準
      - 未盡一般人注意程度即有過失
      - 刑罰相對較輕，須有特別規定始罰
      contrary_facts:
      - 若行為人主觀已有預見且容任，即屬故意而非過失
  distinction_facts:
  - 核心差異在主觀認定標準不同：故意以行為人個人之知與欲為斷，過失以一般合理正常人之注意標準為斷
  - 故意傷害與過失傷害客觀要件相同時，過失刑罰相對較輕
  - 刑法第13條第2項「預見」指行為人於行為時主觀上之預見，非事後一般人評斷是否可以預見
  - 以事後客觀可預見推論主觀故意，即混淆故意與過失之界線
