    relevant_paragraphs:
    - 刑法之恐嚇取財（或得利）罪，須以行為人有為自己或第三人不法所有之意圖為要件，若無意圖為自己或第三人不法所有之意思，縱以恐嚇使人交付財物，除視其情節可構成其他罪名外，不能成立恐嚇取財罪。故債權人因債務人欠債不還，以恐嚇催促履行債務，既無不法所有之意思，除可構成恐嚇、強制、妨害行動自由罪外，尚欠缺恐嚇取財之犯罪成立要件...[截斷]
