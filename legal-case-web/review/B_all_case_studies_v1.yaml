    relevant_paragraphs:
    - 刑法第169條第1項誣告罪之成立，須以被誣告人因虛偽之申告，而有受刑事或懲戒處分之危險為要件，若無此項危險，雖意在使人受刑事或懲戒處分，亦不能成立犯罪...被告提出之告訴已逾告訴期間，其縱有誣告故意，被誣告人亦無受刑事處分之危險，不罰...[截斷]
  case_status:
    procedural_level: 第二審
