- case_id: CASE-FINAL-009
  pair_id: PAIR-033
  source:
    document_type: 判決
    court: 臺灣桃園地方法院
    case_number: 115年度審侵訴字第31號
    judgment_date: '2026-05-04'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TYDM,115,審侵訴,31,20260504,1
    full_text_verified: true
    relevant_paragraphs:
    - 少年有觸犯刑罰法律之行為者，由少年法院依少年事件處理法處理...此即基於保護優先主義原則下，少年法院對於少年非行所得優先行使之先議權...除經少年法院依第27條移送之案件經檢察官偵查起訴者外，檢察官尚無得逕對少年觸法行為發動偵查起訴之權限...被告行為時未滿18歲，檢察官未移送少年法院而逕起訴，起訴程序違背規定，為不受理判決...[截斷]
  case_status:
    procedural_level: 第一審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 被告行為時未滿18歲之少年，被訴對14歲以上未滿16歲女子為性交罪
    - 檢察官未移送少年法院行使先議權，逕向刑事庭提起公訴
    - 法院以起訴程序違背規定諭知公訴不受理
    disputed: []
    unknown: []
    source_attribution:
    - 來源：臺灣桃園地方法院115年度審侵訴字第31號刑事判決
  legal_analysis:
    candidate_a:
      name: 少年事件(觸法)
      applicable_elements:
      - 12歲以上18歲未滿之人觸犯刑罰法律之行為
      - 由少年法院依少事法處理，保護優先，先議權
      - 須經少年法院調查後決定保護處分或移送檢察官
      supporting_facts:
      - 被告行為時未滿18歲觸犯227條
      - 應移送少年法院先議，未經移送逕起訴違背程序
      contrary_facts:
      - 無
    candidate_b:
      name: 少年事件(虞犯)
      applicable_elements:
      - 少年有曝險行為（虞犯事由）而未觸犯刑罰法律
      - 純保護事件，由少年法院為保護處分，無刑罰
      - 以保障健全成長必要為核心
      supporting_facts:
      - 對照概念：未觸法僅曝險即無刑罰問題
      contrary_facts:
      - 本案已觸犯刑罰法律，屬觸法而非虞犯
  distinction_facts:
  - 觸法已有刑罰法律行為，虞犯僅曝險未觸法；前者經先議權後可能移送檢察官受刑事處分，後者僅保護處分
  - 保護優先主義貫穿兩者，但觸法保留刑事處分可能性，虞犯無
  - 本案確立觸法程序：檢察官無逕行偵查起訴權限，違者不受理
  neutral_questions:
  - 行為人行為時是否滿18歲？
  - 行為是否已觸犯刑罰法律，抑或僅有曝險之虞？
  - 案件是否經少年法院先議權調查處理？
  - 以保護處分為適當，還是以刑事處分為適當？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-033，臺灣桃園地方法院115年度審侵訴字第31號
