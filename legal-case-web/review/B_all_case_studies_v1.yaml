  - 殺意認定應綜合動機、下手輕重、次數、兇器、攻擊部位、傷勢致命性等外在證據
  - 傷害致死為加重結果犯：主觀僅具傷害故意，客觀能預見死亡，主觀不預見死亡
  - 互毆、偶發、情緒失控、無預謀、攻擊背部、未持續追殺 → 傷害致死
