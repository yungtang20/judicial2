    - 被告自承知悉前方為紅燈、有車輛停等、仍踩油門加速前行
    - 衝撞後車輛失控偏向逆向車道撞擊機車騎士陳鴻博致死
    - 被告供稱「我不是開車不小心撞的」
    disputed:
    - 被告對第一起衝撞（廖庭毅受傷）是否具有殺人不確定故意
    - 被告對第二起撞擊（陳鴻博死亡）是否具有殺人/傷害故意，或僅屬過失致死
    - 是否因疲勞駕駛、精神疾病導致注意力不集中而非故意
    unknown: []
    source_attribution:
    - 來源：最高法院113年度台上字第972號刑事判決
  legal_analysis:
    candidate_a:
      name: 殺人（含未遂）
      applicable_elements:
      - 有殺人故意（直接或不確定故意）
      - 主觀上預見結果發生且不違背本意
      supporting_facts:
      - 高速衝撞紅燈前車輛、未煞車未鳴喇叭
      - 自承知情仍加速、供稱非不小心
      - 具體認識當時情況
      contrary_facts:
      - 精神疾病、疲勞駕駛可能影響判斷
    candidate_b:
      name: 過失致死
      applicable_elements:
      - 主觀上無預見死亡結果
      - 客觀上依情狀可預見
      - 違反注意義務
      supporting_facts:
      - 第二次撞擊係因第一次衝撞後失控所致
      - 難認被告對第二次具體撞擊情況有主觀預見
      - 被告對後續失控偏行無具體認識
      contrary_facts:
      - 被告駕駛高速衝向路口之一般預見性
  distinction_facts:
  - 核心差異：主觀上有無預見結果發生
  - 故意（含不確定故意）：主觀已預見、且結果發生不違背本意
  - 過失：主觀未預見、但客觀上依當時情狀可預見
  - 駕車案件判斷不確定故意應綜合：車輛類型、行進狀況（車速、直行/轉彎）、有無加速/衝撞/闖紅燈/減速煞車、被害人狀態、犯後舉措、行為人主觀具體認識
  - 第一次衝撞：高速故意加速撞紅燈前車 → 殺人不確定故意
  - 第二次撞擊：因失控偏行撞機車騎士 → 難認有主觀預見 → 過失致死
  neutral_questions:
  - 你開車接近路口時，有沒有看到前面是紅燈、前面有車子停著？當時車速大概多快？
  - 撞上去之前，你有沒有踩煞車、按喇叭或轉方向盤閃避？如果沒有，是來不及還是不想閃？
  - 車子撞上之後失控衝到對向車道時，你有沒有想到可能會撞到旁邊騎車或走路的人？
  - 事發前你有多久沒睡覺？當時身體或精神狀況有沒有什麼異常，例如吃藥或生病？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
