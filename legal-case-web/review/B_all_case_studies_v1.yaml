      name: 跟蹤騷擾
      applicable_elements:
      - 反覆持續違反意願且與性或性別有關之行為
      - 使人心生畏怖足以影響日常生活社會活動
      supporting_facts:
      - 多次接觸騷擾，line及iMessage紀錄、監視照片為證
