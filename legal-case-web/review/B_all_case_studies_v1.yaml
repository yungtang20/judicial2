    relevant_paragraphs:
    - 職務受賄罪祇須所收受之賄賂或不正利益與其職務有相當對價關係即已成立...應實質就職務行為內容、交付者與收受者關係、賄賂種類價額交付時間真正原因及主觀認識綜合判斷...收受廠商禮品僅係年節贈禮人情交誼，亦非具有對價關係之賄款，因認並無圖利得標廠商或違背職務收賄之行為...[截斷]
  case_status:
    procedural_level: 第三審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 里長申請動支村里基層工作經費辦理滅火器採購，經區公所彙整辦理，會同驗收
    - 法院認申請動支經費辦理採購屬里長職務上行為
    - 另案里長發函陳報採購日常用品僅屬建議性質，收受廠商禮品僅年節贈禮人情交誼，無對價關係，認無圖利或違背職務收賄
    - 本案與另案經費來源法令依據採購項目不同，不得比附援引
    disputed:
    - 里長申請採購是否屬職務上行為
    unknown: []
    source_attribution:
    - 來源：最高法院114年度台上字第5817號刑事判決
  legal_analysis:
    candidate_a:
      name: 圖利
      applicable_elements:
      - 公務員對主管監督事務違背法令圖利
      - 明知違背法令而圖私人不法利益
      supporting_facts:
      - 若里長違背法令圖利得標廠商即該當
      contrary_facts:
      - 另案僅建議性質無職務權限，即無圖利可言
    candidate_b:
      name: 賄賂
      applicable_elements:
      - 職務上行為與賄賂有相當對價關係
      - 行賄者有行賄意思，公務員明知而允為特定職務行為
      supporting_facts:
      - 須實質綜合職務內容雙方關係種類價額時間原因主觀認識判斷
      contrary_facts:
      - 年節贈禮人情交誼無對價關係者非賄款
      - 不可以財物名目為餽贈酬謝即謂無對價，須實質判斷
  distinction_facts:
  - 圖利重在違背法令圖私人不法利益，不以收受對價為必要；賄賂重在職務行為與利益之對價關係
  - 有無對價關係應實質判斷，不拘泥財物名目
  - 職務上行為之認定為兩罪共同前提：無職務權限僅建議性質者，兩罪均不成立
  - 本案確立里長申請動支經費屬職務行為，與另案建議性質對照
  neutral_questions:
