    relevant_paragraphs:
    - 性騷擾防治法第25條第1項之性騷擾罪，係行為人對於被害人身體為偷襲式、短暫性、有暗示性之不當騷擾行為，而不符合強制猥褻罪之構成要件者。強制猥褻罪乃侵害被害人之性自主權，亦即妨害被害人性意思形成、決定之自由；乘人不及抗拒而性騷擾罪則尚未達妨害性意思自由之程度，僅破壞被害人所享與性或性別有關之寧靜平和狀態...[截斷]
    - 強制猥褻罪與性騷擾罪均違反被害人意願，但前者非僅短暫之干擾，而已影響被害人意思形成與決定之自由；後者則係於被害人不及抗拒之際，出其不意乘隙偷襲而為短暫之性關連騷擾行為...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 被告對領有身心障礙證明之A女，以手撫摸胸部胯下臀部外陰部，並親吻嘴巴胸部外陰部，且拍攝裸照
    - 過程不顧A女表達不要，將A女拉入房間，有相當時間，施加有形強制力
    - 被告明知A女為智能障礙者，仍違反其意願為之
    - 法院論處刑法第224條之強制猥褻罪而有修正前第222條第1項第3款加重情形，構成第224條之1
    disputed:
