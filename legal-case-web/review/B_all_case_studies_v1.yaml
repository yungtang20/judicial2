    relevant_paragraphs:
    - 核被告所為係犯汽車駕駛人未領有駕駛執照酒醉駕車過失致人於死罪...行為人駕駛動力交通工具之過失實害行為僅有一個，不論過失併存說或階段性過失說均僅受一次非難評價...道交條例第86條第1項列舉無照酒醉毒駕超速等違反注意義務行為，應加重其刑至2分之1，然同時有數加重事由亦僅得加重1次...[截斷]
