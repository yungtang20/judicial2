    full_text_verified: true
    relevant_paragraphs:
    - 刑法妨害性自主罪保護身體性自主之意思形成決定自由，須強暴脅迫等違反意願手段；刑法妨害性隱私罪保護個人性隱私，以未經同意為基本要件...兒少關於性事務自主判斷能力尚未健全，只要成年人對兒少為性之互動或利用即屬兒少性剝削...第2條第1項第3款拍攝兒少性影像不區別兒少有無意願一律保護...[截斷]
    - 只要拍攝兒少性影像就已侵害兒少性隱私與身心健全發展，其行為本身即具剝削性...第36條第1項為一般處罰，第2至4項依行為方法加重...偷拍不知情兒少性影像不該當第36條第3項，應依第1項論處...[截斷]
  case_status:
    procedural_level: 第三審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 上訴人經原審變更起訴法條，論處以違反本人意願方法拍攝少年性影像及未遂共6罪
    - 行為態樣為偷拍不知情兒少性影像，未施強暴脅迫藥劑詐術催眠術
    - 最高法院認是否該當第36條第3項具原則重要性，提案刑事大法庭
    - 大法庭裁定偷拍不知情兒少性影像不該當第3項，未另有第2項第4項行為或營利意圖者應依第1項論處
    - 原判決有罪部分撤銷發回
    disputed:
    - 偷拍不知情兒少性影像是否該當違反意願加重條款
    unknown: []
    source_attribution:
    - 來源：最高法院114年度台上字第1405號刑事判決暨刑事大法庭114年度台上大字第1405號裁定
  legal_analysis:
    candidate_a:
      name: 兒少性剝削
      applicable_elements:
      - 特別法，保護兒少性隱私與身心健全發展
      - 不區別兒少有無意願或決定權，一律保護
      - 拍攝兒少性影像本身即具剝削性
      - 第36條層級化處罰：第1項基本罪，第2至4項依方法加重
      supporting_facts:
      - 只要拍攝兒少性影像即侵害法益
      - 偷拍不知情兒少仍成立第1項基本罪
      contrary_facts:
      - 未施強制手段之偷拍不得擬制為違反意願而論第3項加重罪
    candidate_b:
      name: 妨害性自主
      applicable_elements:
      - 普通法，保護身體性自主之意思形成決定自由
      - 須強暴脅迫恐嚇催眠術或其他違反意願手段
      supporting_facts:
      - 若對兒少施強制手段為性交猥褻，另成立妨害性自主罪
      contrary_facts:
      - 本案僅偷拍未施強制手段，不成立妨害性自主之強制犯罪
      - 未經同意與強制違反意願規範對象不同，不得混同
  distinction_facts:
  - 特別法 vs 普通法：兒少條例不問意願一律保護，刑法妨害性自主以違反意願手段為要件
  - 未經同意（性隱私）vs 強制違反意願（性自主意思自由）為不同規範對象，法院不得將前者擬制為後者從重處罰
  - 拍攝兒少性影像本身即具剝削性，無須證明不對等權力壓榨
  - 偷拍不知情兒少 → 36條第1項而非第3項，罪責相當層級化
  neutral_questions:
  - 照片或影片裡的孩子大約幾歲？是怎麼認識對方的？
  - 拍攝的時候，孩子知不知道有人在拍？有沒有人用打罵、威脅或騙的方式叫孩子配合？
  - 這些照片影片後來有沒有傳給別人、放到網路上，或拿去賣錢？
  - 孩子當時有沒有表示願意被拍？如果不確定，是哪些部分記不清楚？
