    full_text_verified: true
    relevant_paragraphs:
    - 被告基於跟蹤騷擾、侵入建築物、誹謗、加重誹謗、公然侮辱、恐嚇危害安全犯意，分別為附表多達30餘起犯行...確實反覆持續對告訴人為違反其意願且與性或性別有關之騷擾行為，使告訴人心生畏怖，足以影響其日常生活及社會活動...[截斷]
