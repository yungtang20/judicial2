  pair_id: PAIR-031
  source:
    document_type: 判決
    court: 臺灣屏東地方法院
    case_number: 115年度易字第872號
    judgment_date: '2026-10-12'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=PTDM,115,易,872,20261012,1
    full_text_verified: true
    relevant_paragraphs:
    - 被告與告訴人為兄妹，具有家庭暴力防治法第3條第4款之家庭成員關係...對告訴人為本案傷害行為，自該當家庭暴力防治法第2條第2款所稱之家庭暴力罪，惟因家庭暴力防治法對於家庭暴力罪並無科處刑罰之規定，是應依刑法規定予以論罪科刑...核所為係犯刑法第277條第1項之傷害罪...[截斷]
