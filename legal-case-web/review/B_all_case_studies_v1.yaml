- case_id: CASE-FINAL-008
  pair_id: PAIR-032
  source:
    document_type: 判決
    court: 臺灣橋頭地方法院
    case_number: 106年度訴字第55號
    judgment_date: '2017-12-22'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=CTDM,106,訴,55,20171222,1
    full_text_verified: true
    relevant_paragraphs:
    - 被告夫妻共同經營食品公司，為長期穩定廉價勞務，利用移工非法居留語言不通難以求助之處境，使從事勞動與顯不相當報酬之工作...共同意圖營利，利用難以求助處境使從事顯不相當工作，各論處人口販運罪...仲介利用移工不熟悉法令佯稱繳仲介費可續留工作，使陷於錯誤按月交付，論處詐欺取財罪...[截斷]
  case_status:
    procedural_level: 第一審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 被告夫妻經營食品公司，利用2名印尼移工非法居留語言不通難以求助處境，使其長期處於服勞務狀態僅給基本薪資
    - 論處意圖營利利用難以求助處境使從事顯不相當工作罪
    - 仲介利用移工不熟悉法令佯稱繳費可續留，使按月交付19萬餘元，論詐欺取財罪緩刑3年
    - 仲介師明知無曠職仍登載不實申報表，論業務登載不實罪
    disputed: []
    unknown: []
    source_attribution:
    - 來源：臺灣橋頭地方法院106年度訴字第55號刑事判決
  legal_analysis:
    candidate_a:
      name: 人口販運
      applicable_elements:
      - 意圖營利
      - 利用不當債務約束或他人不能不知難以求助處境
      - 使從事勞動與報酬顯不相當之工作
      supporting_facts:
      - 利用非法居留語言不通難以求助，長期服勞務僅基本薪資
      - 剝削意圖＋不當手段＋顯不相當三要件俱足
      contrary_facts:
      - 無
    candidate_b:
      name: 妨害自由/詐欺
      applicable_elements:
      - 妨害自由：剝奪行動自由
      - 詐欺：施詐術使陷錯誤處分財產
      supporting_facts:
      - 仲介佯稱繳費可續留使按月交付，成立詐欺取財
      contrary_facts:
      - 本案移工雖受控制但核心為勞力剝削而非單純限制行動或騙財，故雇主論人口販運而非妨害自由詐欺
  distinction_facts:
  - 人口販運須剝削意圖＋不當手段結合：利用弱勢處境榨取勞力或性等價值，報酬顯不相當
  - 單純限制行動無剝削 → 妨害自由；單純騙財無勞力剝削 → 詐欺
  - 本案同案三種行為分論三罪，完整展示界線：雇主剝削勞力為人口販運，仲介騙費為詐欺，登載不實另論
  neutral_questions:
  - 你是否利用對方弱勢處境使其為你工作？
  - 給付之報酬與勞動是否顯不相當？
  - 你的目的在榨取勞力價值，還是單純限制其行動或騙取財物？
  - 對方是否因非法居留語言不通而不敢求助？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
