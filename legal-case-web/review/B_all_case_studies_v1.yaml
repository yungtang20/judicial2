      supporting_facts:
      - 多處挫傷，論處傷害罪
      contrary_facts:
      - 無
  distinction_facts:
  - 家暴非獨立罪名而為身分評價：具家庭成員關係＋成立刑法犯罪 → 該當家庭暴力罪，但依刑法論罪科刑
  - 無家庭成員關係 → 僅一般傷害罪，無家暴評價及保護令等附隨處置
  - 本案典型示範家暴論罪模式：先確認家庭成員身分，再依刑法277論處
