  legal_analysis:
    candidate_a:
      name: 性騷擾(觸摸)
      applicable_elements:
      - 意圖性騷擾，乘人不及抗拒而為親吻擁抱觸摸臀部胸部或身體隱私處
      - 偷襲式、短暫性、有暗示性之不當騷擾
      - 未達妨害性意思自由之程度
      supporting_facts:
      - 若僅短暫偷襲觸摸即離去，屬此罪
      contrary_facts:
      - 本案行為有相當時間、持續撫摸親吻多處、拍裸照，並非偷襲短暫觸摸
      - 已妨害性意思形成決定自由，不符性騷擾要件
    candidate_b:
      name: 強制猥褻
      applicable_elements:
      - 以強暴脅迫恐嚇催眠術或其他違反意願之方法
      - 而為性交以外足以引起滿足性慾之猥褻行為
      supporting_facts:
      - 拉入房間、不顧拒絕、長時間多部位撫摸親吻、拍裸照
      - 施加有形強制力，妨害性意思自由
      - 被害人為心智缺陷之人，加重處罰
      contrary_facts:
      - 無
  distinction_facts:
  - 核心差異在侵害法益程度：強制猥褻侵害性自主權（妨害性意思形成決定自由），性騷擾僅破壞性平和狀態（寧靜不受干擾）
  - 手段區分：強制猥褻為有形強制力＋相當時間；性騷擾為偷襲式短暫性觸摸
  - 兩罪均違反意願，但前者影響意思自由，後者僅短暫干擾
  - 本案長時間、多部位、拍裸照 → 強制猥褻而非性騷擾
  neutral_questions:
