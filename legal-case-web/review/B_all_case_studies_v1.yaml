- case_id: CASE-B4-003
  pair_id: PAIR-013
  source:
    document_type: 判決
    court: 臺灣高等法院臺中分院
    case_number: 112年度上訴字第515號
    judgment_date: '2023-12-06'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TCHM,112,上訴,515,20231206,1
    full_text_verified: true
    relevant_paragraphs:
    - A男、B女2人依民法第1084條第2項、第1114條第1款、第4款及第1115條第1項第2款規定，均對甲童負有保護、教養與扶養之義務，而具照顧甲童之保證人地位...共同基於遺棄之不確定故意，未將甲童送醫診治，讓甲童陷入生存危險...因甲童燙傷如此嚴重，一般客觀情況下，可能預見有休克死亡之結果，但A男、B女主觀上未預見...仍不將甲童送醫急救以履行維持甲童生存所必要之扶助、養育及保護等義務...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_get_judgment
  facts:
    established:
    - A男、B女為甲童父母，具法定保護教養扶養義務（保證人地位）
    - 甲童為早產兒且有發展遲緩，長期遭忽視教養醫療，身心發育嚴重遲緩
    - 甲童因自行泡熱水燙傷全身30%面積二到三度燒燙傷
    - B女發現後僅簡易處理未送醫，A男欲報119被B女以無醫藥費制止
    - 雙方共同基於遺棄之不確定故意，未送醫讓甲童陷入生存危險
    - 甲童因燒燙傷休克死亡
    disputed:
    - 行為人不作為（未送醫）是否構成遺棄致死、傷害致死或殺人
    - 是否具備殺人/傷害故意，或僅屬遺棄（不作為犯）
    unknown: []
    source_attribution:
    - 來源：臺灣高等法院臺中分院112年度上訴字第515號刑事判決
  legal_analysis:
    candidate_a:
      name: 遺棄（致死）
      applicable_elements:
      - 對無自救能力之人負有扶助義務（保證人地位）
      - 不作為：未為必要扶助行為
      - 遺棄故意（含不確定故意）：明知可能危及生命仍不作為
      - 致死結果
      supporting_facts:
      - 父母對幼子負法定扶養保護義務
      - 知悉燙傷嚴重可能休克死亡仍不送醫
      - 主觀上未預見死亡、但容任其發生（不確定故意）
      - 屬不作為犯：未履行積極作為義務
      contrary_facts:
      - 無積極作為致死行為
      - 無殺人/傷害故意
    candidate_b:
      name: 殺人/傷害（致死）
      applicable_elements:
      - 殺人：有殺意（直接/間接）
      - 傷害：有傷害故意，客觀預見死亡、主觀不預見
      supporting_facts:
      - 客觀上一般人可預見大面積燒燙傷不送醫會死
      contrary_facts:
      - 行為型態為不作為（未送醫），非積極作為
      - 無殺人動機、無傷害故意
      - 主觀未預見死亡、亦無容任死亡之確定故意
  distinction_facts:
  - 核心差異：作為犯 vs 不作為犯、有無積極致死/傷害行為
  - 遺棄：基於法定/契約義務（保證人地位），以「不作為」違背扶助義務，讓被害人陷入生存危險
  - 殺人/傷害：需有積極作為行為（作為犯）致人死傷
  - 本案行為人僅為「不送醫」（不作為），且具保證人地位 → 遺棄致死
  - 主觀上屬不確定故意（預見可能死亡、容任發生），非殺人/傷害故意
  - 不作為犯之構成：有作為義務、能作為而不作為、以作為相當、故意遺棄
  neutral_questions:
  - 你跟這個孩子是什麼關係？平常是誰在照顧他的生活起居？
  - 孩子燙傷當時，傷勢看起來有多嚴重？你有沒有看到起水泡、脫皮或大面積發紅？
  - 從發現燙傷到孩子過世之間大約隔了多久？這段時間你們做了哪些處理，有沒有打電話求助或送醫院？
  - 當時為什麼沒有把孩子送去醫院？是沒有錢、沒有交通工具，還是有其他原因？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
