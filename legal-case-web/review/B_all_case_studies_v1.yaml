    full_text_verified: true
    relevant_paragraphs:
    - 刑法第302條之妨害自由罪，係妨害他人自由之概括規定，如以使人行無義務之事為目的，而其方法已達剝奪他人行動自由之程度時，其使人行無義務之事，已為剝奪他人行動自由之行為所吸收，應僅成立剝奪他人行動自由罪，不再論以刑法第304條第1項之強制罪...[截斷]
  case_status:
    procedural_level: 第一審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 被告等8人以多人圍堵、毆打、電擊、恫嚇及限制行動自由等方式，迫使告訴人3人籌措款項及簽立本票
    - 被告郭玉卿於剝奪告訴人胡炳河行動自由過程中，違反其意思取走其所持現金
    - 法院論處被告等剝奪他人行動自由罪及恐嚇取財罪，公訴意旨另指強盜部分經論述威嚇程度而區辨
    disputed:
    - 以使人行無義務之事為目的之行為，應成立強制罪或為妨害自由罪所吸收
    - 行為手段是否達剝奪行動自由之程度
    unknown: []
    source_attribution:
    - 來源：臺灣屏東地方法院113年度訴字第54號刑事判決
  legal_analysis:
    candidate_a:
      name: 妨害自由
      applicable_elements:
      - 以強暴脅迫剝奪他人行動自由
      - 妨害他人自由之概括規定
      supporting_facts:
      - 多人圍堵、限制行動、迫使籌款簽立本票
      - 方法已達剝奪行動自由之程度
      - 使人行無義務之事為剝奪行動自由行為所吸收
      contrary_facts:
      - 若手段未達剝奪行動自由程度，僅能論以強制罪
    candidate_b:
      name: 強制
      applicable_elements:
      - 以強暴脅迫使人行無義務之事或妨害人行使權利
      - 未達剝奪行動自由之程度
      supporting_facts:
      - 恫嚇、毆打、電擊等脅迫手段
      - 迫使簽立本票、籌措款項等無義務之事
      contrary_facts:
      - 方法已達剝奪行動自由程度時，不再另論強制罪
      - 本案被告郭玉卿強制取財行為為剝奪行動自由所吸收
  distinction_facts:
  - 核心差異在手段是否達剝奪他人行動自由之程度
  - 妨害自由為概括規定：以使人行無義務之事為目的＋方法達剝奪行動自由程度 → 僅成立妨害自由罪，強制罪被吸收
  - 手段未達剝奪行動自由程度 → 僅成立強制罪
  - 本案圍堵、限制行動、迫簽本票已達剝奪程度 → 論妨害自由，不另論強制
  neutral_questions:
