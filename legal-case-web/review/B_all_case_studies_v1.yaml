- case_id: CASE-B6-002
  pair_id: PAIR-018
  source:
    document_type: 判決
    court: 臺灣高等法院高雄分院
    case_number: 115年度上易字第236號
    judgment_date: '2026-07-16'
    official_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=KSHM,115,上易,236,20260716,1
    full_text_verified: true
    relevant_paragraphs:
    - 刑法第309條係處罰「公然侮辱」之言論，第310條則處罰「意圖散布於眾，指摘或傳述足以毀損他人名譽之事」之言論...前者係未指定具體事實，僅為抽象謾罵；後者則係對於具體事實，有所指摘...只有事實陳述有所謂真實與否的問題；意見表達或評論並無所謂真實與否之問題...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 被告A02至告訴人住處外舉牌、廣播，發表言論內容尖銳，有怪罪告訴人之意思
    - 被告自稱因土地買賣糾紛致生意荒廢負債累累，自認告訴人害其家破人亡、財產散盡、走投無路
    - 被告與告訴人間確存有土地繼承買賣佣金糾紛
    - 原審諭知誹謗及加重誹謗無罪，檢察官上訴經本院駁回維持
    disputed:
    - 被告尖銳言論是否指摘告訴人之特定具體事實而成立誹謗罪
    unknown: []
    source_attribution:
    - 來源：臺灣高等法院高雄分院115年度上易字第236號刑事判決
  legal_analysis:
    candidate_a:
      name: 公然侮辱
      applicable_elements:
      - 公然侮辱人
      - 未指定具體事實，僅為抽象謾罵
      - 無所謂事實真偽問題
      supporting_facts:
      - 被告言論尖銳足令告訴人不快、自認名譽受影響
      - 僅陳述雙方存在糾紛、家庭財產受影響，未提及特定具體事項
      - 屬情緒用語表達不滿
      contrary_facts:
      - 若指摘具體事實足以毀損名譽，即屬誹謗而非侮辱
    candidate_b:
      name: 誹謗
      applicable_elements:
      - 意圖散布於眾
      - 指摘或傳述足以毀損他人名譽之具體事實
      - 事實陳述有所謂真實與否問題
      supporting_facts:
      - 被告至住處外舉牌廣播，具散布於眾之外觀
      contrary_facts:
      - 言論未針對告訴人之特定具體事實為指摘或傳述
      - 家破人亡等語僅為形容糾紛影響之情緒用語
      - 與誹謗須指摘具體事實之要件有間，不成立誹謗罪
  distinction_facts:
  - 核心差異在有無指摘具體事實：侮辱為未指定具體事實之抽象謾罵，誹謗為對具體事實有所指摘
  - 只有事實陳述有所謂真實與否問題，意見表達或評論無真實與否問題
  - 誹謗罪僅規範事實陳述，尖酸刻薄之意見評論不在誹謗處罰範圍
  - 本案被告言論雖尖銳但未指摘特定具體事項 → 不成立誹謗罪
  neutral_questions:
  - 你所說的話是否指涉對方做過的特定具體事情？
  - 你能否說出對方何時、何地、做了什麼具體行為？
  - 你是在陳述可驗證真假的事實，還是在表達情緒或評價？
  - 旁人聽到你的話，能否得知具體事件內容，抑或僅感受到謾罵？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-018，臺灣高等法院高雄分院115年度上易字第236號
