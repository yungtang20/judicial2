    candidate_a:
      name: 殺人
      applicable_elements:
      - 有殺人故意（直接或間接）
      - 客觀行為外顯殺意
      supporting_facts:
      - 攻擊要害部位、使用兇器、刺擊深度
      contrary_facts:
