  legal_analysis:
    candidate_a:
      name: 誣告
      applicable_elements:
      - 意圖他人受刑事或懲戒處分
      - 向該管公務員為虛偽申告
      - 被誣告人有受刑事或懲戒處分之危險
      supporting_facts:
      - 明知未發生仍向地檢署提告毀損傷害並提供照片為證
      - 檢察官據以分案開始偵辦，被誣告人陷於受處分危險
      - 論處向該管公務員誣告罪
      contrary_facts:
      - 逾告訴期間之申告，被誣告人無受處分危險，縱有故意亦不罰
    candidate_b:
      name: 妨害名譽
      applicable_elements:
      - 意圖散布於眾
      - 指摘或傳述足以毀損他人名譽之事
      - 對象為公眾而非該管公務員
      supporting_facts:
      - 若僅向親友鄰里散布不實指控而未向公務員申告，無受處分危險
      contrary_facts:
      - 本案係向地檢署檢察官申告並啟動偵查，非向公眾散布
      - 被誣告人陷於刑事處分危險，構成誣告而非單純妨害名譽
  distinction_facts:
  - 核心差異在申告對象與法益危險：誣告須向該管公務員申告且使被誣告人有受刑事或懲戒處分之危險
  - 向公眾散布不實之事毀損名譽 → 妨害名譽；向該管公務員虛偽申告啟動偵查審判 → 誣告
  - 無受處分危險時縱有誣告故意亦不成立誣告罪，此為誣告獨有之危險要件
  - 本案向地檢署申告且經分案偵辦 → 誣告既遂；逾告訴期間部分因無危險 → 不罰
