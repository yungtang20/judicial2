      applicable_elements:
      - 持有毒品，無販賣意圖
      - 供己施用或單純持有
      supporting_facts:
      - 若數量合於施用量、有施用習慣陽性反應、無分裝磅秤，即屬單純持有
      contrary_facts:
      - 數量龐大非短期可施用完畢、尿液陰性、分裝如販售包裝、隨車攜磅秤 → 非單純持有
    candidate_b:
      name: 施用/販賣
      applicable_elements:
      - 意圖販賣而持有：以販賣為持有目的
      - 販賣未遂：已著手販賣而未完成
      supporting_facts:
      - 數量性質分裝磅秤尿液陰性綜合認定販賣意圖
      - 論處意圖販賣而持有罪
      contrary_facts:
      - 未查獲交易紀錄帳本，但不影響意圖認定
  distinction_facts:
  - 三者均具持有外觀，區別在主觀目的與行為階段：單純持有無販賣目的，意圖販賣而持有以販賣為目的，販賣未遂已著手販賣
  - 意圖屬內心活動，得以間接證據認定：數量、性質、分裝、磅秤、尿液、有無施用習慣、前科
  - 高度行為吸收低度行為：販賣吸收意圖持有，意圖持有吸收單純持有及施用
  neutral_questions:
  - 你持有毒品之數量，是否超出個人短期施用量？
  - 你有無施用毒品習慣，尿液檢驗結果為何？
  - 有無分裝、磅秤、帳冊、交易紀錄等販賣跡象？
  - 你持有毒品之目的是自用還是販賣？
  alternative_outcomes:
    both_possible: false
    neither_possible: false
    insufficient_information: true
  review:
    status: unreviewed
    reviewer_notes:
    - PAIR-028，最高法院115年度台上字第4196號
- case_id: CASE-FINAL-005
  pair_id: PAIR-029
  source:
    document_type: 判決
    court: 最高法院
