    - 來源：臺灣屏東地方法院115年度易字第872號刑事判決
  legal_analysis:
    candidate_a:
      name: 家暴
      applicable_elements:
      - 行為人與被害人間具家庭成員關係
      - 故意實施身體精神經濟上不法侵害而成立犯罪
      - 該當家暴法第2條第2款家庭暴力罪
      supporting_facts:
      - 兄妹同住因口角施暴
      - 該當家庭暴力罪
