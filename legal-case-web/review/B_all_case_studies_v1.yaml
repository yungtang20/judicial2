  legal_analysis:
    candidate_a:
      name: 恐嚇危害安全
      applicable_elements:
      - 以加害生命身體自由名譽財產之事恐嚇他人致生危害於安全
      - 無須具不法所有意圖
      supporting_facts:
      - 以斷手斷腳、包圍不讓離開等言語及人多勢眾之勢恫嚇
      - 告訴人手抖、感到害怕、心生畏懼
      - 行為目的在催促處理債務，非取得不法利益
      contrary_facts:
      - 若具不法所有意圖並使人交付財物，即可能升級為恐嚇取財
    candidate_b:
      name: 恐嚇取財
      applicable_elements:
      - 以恐嚇使人交付財物或得財產上不法利益
      - 須具為自己或第三人不法所有之意圖
      supporting_facts:
      - 強使簽發146萬元本票並交付收執
      contrary_facts:
      - 被告與告訴人間確存債務關係，主張有所本且不違經驗法則
      - 行為意在催促履行債務或自力滿足債權，無不法所有意思
      - 無證據足認具不法所有意圖，不另為恐嚇得利無罪諭知
  distinction_facts:
  - 核心差異在有無為自己或第三人不法所有之意圖
  - 有不法所有意圖＋恐嚇使人交付財物 → 恐嚇取財（得利）
  - 無不法所有意圖，僅為催促履行債務 → 僅構成恐嚇、強制、妨害自由，不成立恐嚇取財
  - 主觀不法所有意圖之有無，不以債務經民事法律關係詳為認定確有存在為必要，被告主張有所本且不違經驗法則即可
  - 恐嚇取財之恐嚇行為本身亦該當恐嚇危害安全，區別關鍵全在財產意圖
