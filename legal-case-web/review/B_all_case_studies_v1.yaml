    - 被告以手觸摸、以手指插入A女B女生殖器
    - 法院論處刑法第222條第1項第2款對未滿14歲女子犯強制性交罪，強制猥褻低度行為為高度行為吸收
    - 公訴意旨另指其餘多次犯行因證據不足不另為無罪諭知
