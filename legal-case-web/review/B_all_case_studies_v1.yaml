    relevant_paragraphs:
    - 被告陳宥任非法利用民眾之個人資料，冒用其等名義對他人提出刑事告訴，或偽造契約收據等證據後，以杜撰虛捏之情節誣告他人，抑或利用聲請支付命令或提起民事訴訟，甚至於民事程序中冒用對造名義提出陳報狀以自認其主張，更於偵查中接受檢察官訊問時供前具結而為偽證行為...[截斷]
    - 原判決就被告誣告案件自白，在所犯誣告案件裁判確定前自白，均依刑法第172條規定減輕其刑...[截斷]
  case_status:
    procedural_level: 第二審
    outcome: verified_via_get_judgment
  facts:
    established:
    - 被告冒用民眾個人資料，向臺北等22個地檢署提出146件不實刑事告訴
    - 被告偽造契約收據對話紀錄等證據，以杜撰情節誣告他人，並聲請支付命令及提起民事訴訟牟利
    - 被告於偵查中接受檢察官訊問時，經供前具結而為偽證行為
