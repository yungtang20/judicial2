# B9 問句補充檔（來源 batch9 YAML 已於目錄清理時刪除，此檔依 session 紀錄原樣重建，僅供填入套表用）
- pair_id: PAIR-038
  neutral_questions:
  - 你罵人或講那些話的時候，地點在哪裡？當時旁邊有幾個人在場，他們跟你們認不認識？
  - 你講的話裡面，有沒有提到對方具體做過哪一件事，例如什麼時間、在哪裡、做了什麼？
  - 對方聽到之後有什麼反應？有沒有當場表示要告你，還是只是走開？
  - 你跟對方之前認不認識？是第一次吵架，還是已經吵過很多次了？
- pair_id: PAIR-039
  neutral_questions:
  - 你們玩牌或玩遊戲的地方在哪裡？是自己家裡、店面，還是路邊、公園這種誰都可以走進來的地方？
  - 當天玩的是什麼？一局輸贏大概多少錢？這些錢對你們來說是零用錢等級，還是很大的數目？
  - 現場有沒有人向贏的人抽錢、收場地費，或有人專門發牌、記帳？
  - 你們這群人是偶爾聚一次玩好玩的，還是幾乎每天都聚在同一個地方玩？
- pair_id: PAIR-040
  neutral_questions:
  - 事情發生的地點在哪裡？當時旁邊有沒有不認識的人會看到或聽到，大概有幾個？
  - 你當時具體做了什麼動作？衣服有沒有穿好？持續了多久？
  - 在場的人看到之後有什麼反應？有沒有人罵你、報警或帶小孩離開？
  - 那個地方平常人多不多？是白天還是深夜？
- pair_id: PAIR-041
  neutral_questions:
  - 你當時對警察做了什麼動作？有推、打、踢，還是只有用說的？
  - 你的動作有沒有讓警察無法繼續執行工作，例如把人推開或搶東西？
  - 當時有沒有監視器或密錄器拍到過程？畫面裡你做了什麼？
  - 你是因為不滿警察的作法一時生氣，還是故意要讓他不能辦事？
- pair_id: PAIR-042
  neutral_questions:
  - 對方身上有沒有受傷？有沒有去醫院開診斷證明？傷到什麼部位？
  - 打架持續了多久？警察來的時候還在打，還是已經停了？
  - 除了你們雙方，還有沒有路人或其他人被波及或嚇到？
  - 你們是本來約好要去打架，還是一開始在做別的事臨時吵起來？
- pair_id: PAIR-043
  neutral_questions:
  - 東西被弄髒或弄壞之後，還能不能正常使用？要修的話大概要花多少錢？
  - 髒污的部分用水洗一洗、擦一擦能不能恢復原狀？還是已經破掉碎掉？
  - 你用的是什麼東西去弄的？丟雞蛋潑漆，還是拿磚頭棍棒去砸？
  - 弄完之後，對方有沒有辦法馬上繼續使用那個東西？
- pair_id: PAIR-044
  neutral_questions:
  - 你們當天是約好要去吃飯唱歌，還是約好要去找對方打架？
  - 去之前有沒有人準備棍棒刀械，或打電話叫更多人來？
  - 打起來之前，你們跟對方是第一次見面吵起來，還是早就約好時間地點？
  - 現場總共有多少人動手？有沒有人只是在旁邊看？
- pair_id: PAIR-045
  neutral_questions:
  - 你帶的這把槍是什麼槍？在哪裡買的？買的時候店家有沒有說需不需要證照？
  - 這把槍有沒有拿去鑑定？鑑定結果能不能打穿東西？
  - 你帶著它出門是要做什麼？當時有沒有拿出來把玩或擊發？
  - 你知不知道這把槍跟真槍長得很像？一般人看得出來是假的嗎？
- pair_id: PAIR-046
  neutral_questions:
  - 這把槍你是直接買現成的，還是買來之後自己有動手改裝過？
  - 你有沒有換過槍管、撞針，或用工具磨過、車過零件？
  - 你買槍的時候，它本來能不能打？是你改完之後才變得有殺傷力嗎？
  - 除了這把槍，你還有沒有藏子彈、散彈或其他零件放在別的地方？
