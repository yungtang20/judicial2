<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>登入｜法律案件工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth.css">
  <script src="/auth.js" defer></script>
</head>
<body>
  <main class="auth-main">
    <section class="auth-panel" aria-labelledby="auth-title">
      <p class="eyebrow">PRIVATE · SINGLE USER</p>
      <h1 id="auth-title">法律案件工作台</h1>
      <p id="auth-description">請登入個人帳號。帳號僅供單一使用者使用。</p>
      <p class="auth-warning">請勿在公用或共用裝置登入。案件內容於服務記憶體處理，服務重新啟動後不保留。</p>
      <form id="auth-form" autocomplete="on">
        <label for="username">帳號</label>
        <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]{3,32}" required>
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="14" maxlength="256" required>
        <div id="invite-wrap" hidden>
          <label for="invite-code">一次性註冊邀請碼</label>
          <input id="invite-code" name="invite_code" type="password" autocomplete="off" minlength="32" maxlength="256">
        </div>
        <button id="submit" class="primary" type="submit">登入</button>
      </form>
      <button id="toggle-mode" class="secondary" type="button" hidden>建立帳號</button>
      <p id="auth-status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
