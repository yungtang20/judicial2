services:
  - type: web
    name: legal-case-workbench
    runtime: docker
    plan: free
    branch: main
    rootDir: legal-case-web
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_DATABASE_PATH
        value: /tmp/accounts.sqlite3
      - key: ALLOW_EXTERNAL_AI
        value: "false"
      - key: REGISTRATION_INVITE_CODE
        sync: false
