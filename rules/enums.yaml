  complaint_status:
  - value: 已提告
    source_refs:
    - section: '7.3'
      source_text: |2-
            告訴狀態：已提告／告訴未成立／告訴意思未定／NOT_APPLICABLE／UNKNOWN
  - value: 告訴未成立
    source_refs:
    - section: '7.3'
      source_text: |2-
            告訴狀態：已提告／告訴未成立／告訴意思未定／NOT_APPLICABLE／UNKNOWN
    - section: G2-R09
      source_text: |-
        2. 告訴乃論之案類，若被害人表示不提告、不需協助、拒絕告訴或已撤回，標示「告訴未成立」，加 warning，強行通過。「不需警方協助」等同於不提告。
    - section: G2-R09
      source_text: |-
        5. 告訴未成立後若被害人之後提告，依 G1-R09 重新判斷告訴期間。
  - value: 告訴意思未定
    source_refs:
    - section: '7.3'
      source_text: |2-
            告訴狀態：已提告／告訴未成立／告訴意思未定／NOT_APPLICABLE／UNKNOWN
    - section: G2-R09
      source_text: |-
        1. 僅適用於受理性質為受理、告訴之紀錄。備案、告發、查獲不適用。依案號推定之受理，告訴狀態依報告內容判定，無告訴意思表示者標「告訴意思未定」。
    - section: G2-R09
      source_text: |-
        3. 告訴意思為「未定」或「保留」者，標示「告訴意思未定」，加 warning，強行通過。「保留告訴權益」屬保留。
  - value: NOT_APPLICABLE
    source_refs:
    - section: '7.3'
      source_text: |2-
            告訴狀態：已提告／告訴未成立／告訴意思未定／NOT_APPLICABLE／UNKNOWN
    - section: G2-R09
      source_text: |-
        6. 非告訴乃論之案類，告訴狀態標 NOT_APPLICABLE。
  - value: UNKNOWN
    source_refs:
    - section: '7.3'
      source_text: |2-
            告訴狀態：已提告／告訴未成立／告訴意思未定／NOT_APPLICABLE／UNKNOWN
