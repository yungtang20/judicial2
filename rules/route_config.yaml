version: 2026-10-09-v19
source_section: '4.3'
routes:
- route: A
  text: |-
    | A | 事實含刑事行為，有被害人（依 4.1），受理性質為受理、告訴、告發或受理（依案號推定） | Gate 1 → Gate 2 → Gate 3 | 詐欺、竊盜、傷害、妨害性隱私、業務侵占、妨害電腦使用、信用卡盜刷已受理 |
- route: B
  text: |-
    | B | 事實含刑事行為，無被害人（依 4.1），受理性質為受理、告訴、告發、查獲或受理（依案號推定） | Gate 1 → Gate 3（不經 Gate 2） | 通緝查獲（須附通緝書）、酒駕、毒駕、毒品（線上立破）、公共危險、無特定受害人之偽造文書告發、無特定受害人之告訴 |
- route: C
  text: |-
    | C | 事實無刑事行為，或受理性質為備案且無刑事行為，有案號（如民事用途） | Gate 1 → 非罪受理紀錄 | 失蹤人口撤尋、非道路車禍報案證明、遺失物備案、車損備案、無刑事內容之備查 |
- route: D
  text: |-
    | D | 無案號，且無刑事行為（或備案），非行政裁處 | 不進入流程，保留路由結果與 source_raw | 災害、死亡相驗、救護、糾紛、為民服務 |
- route: E
  text: |-
    | E | 行政裁處案件（社會秩序維護法、道路交通管理處罰條例等） | Gate 1 → 移送裁罰紀錄（不進入 Gate 2、Gate 3） | 社維法違序、自行車酒駕行政裁罰 |
decision_rules:
- number: 1
  text: |-
    1. **備案**：受理性質為備案且無案號者，歸 D；若事實含刑事行為，依 G1-R22 產出承辦人待辦清單，不進入路由 A 或 B。有案號之備案，依 4.2 第 2 點推定受理性質後判定路由。
- number: 2
  text: |-
    2. **報案、通報、函送、移送**：無案號者，若事實含刑事行為，不作為告訴，依 G1-R18 記錄提示，不產出刑事單元。
- number: 3
  text: |-
    3. **有案號之報案**：受理性質為報案，但有案號且事實含刑事行為者，依 4.2 第 2 點推定為受理，依事實與被害人判定路由 A 或 B。
- number: 4
  text: |-
    4. **案號缺漏**：受理性質為受理、告訴、告發、報案、通報、函送或移送，且事實含刑事行為者，不得歸 D。案號標 UNKNOWN，加 warning「案號未填，請承辦人補填」，依事實路由為 A 或 B。
- number: 5
  text: |-
    5. **告訴無被害人**：受理性質為告訴，但無被害人者，歸路由 B。告訴權人、告訴意思記錄於 Gate 1，告訴乃論依 G2-R03 判斷，告訴狀態由 Gate 1 標示。
- number: 6
  text: |-
    6. 同一事件同時有刑事與行政部分者，分別路由，各自記錄。
- number: 7
  text: |-
    7. 路由 B 之罪章與法條由 Gate 1 標示（見 G1-R14），相關罪章檢核依 G1-R20 於 Gate 1 執行。
- number: 8
  text: |-
    8. 路由 B 之告訴乃論、告訴期間、被害人問句標示 NOT_APPLICABLE（路由 B 因告訴而歸入者，告訴乃論與告訴期間依 G1-R09 由 Gate 1 標示）。追訴權狀態仍由 Gate 1 標示（見 G1-R15）。
- number: 9
  text: |-
    9. 路由 C 產出非罪受理紀錄，不產出案類與涉嫌人問句。
- number: 10
  text: |-
    10. 路由 E 依 G1-R16 記錄行政時效與移送事實，最小紀錄依 G1-R16 第 4 點，流程終止。
