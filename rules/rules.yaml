version: 2026-10-09-v19
scope:
  included:
  - C-R01..C-R22
  - G1-R01..G1-R24
  rule_count: 46
rules:
- id: C-R01
  title: 同次輸出檢查
  gate: C
  text: |-
    每個 Gate 的處理結果與規則檢查須在同一次 LLM 呼叫完成。不得先輸出結果，再另外呼叫檢查。
  check_type: program
  source_section: '3'
  notes: ''
- id: C-R02
  title: 處理結果只有兩種
  gate: C
  text: |-
    1. 合格則直接進入下一 Gate。
    2. 不合格則補充後進入，或強行通過。
    3. 「補充後進入」指流程於該 Gate 停止，直到補件或補充完成後，才由同一 Gate 重新檢查並進入下一 Gate。停止不是第三種結果。
    4. 不得有其他結果。
  check_type: program
  source_section: '3'
  notes: ''
- id: C-R03
  title: warning 全程傳遞與編號
  gate: C
  text: |-
    1. 每個 Gate 產生的 warning 須傳入下一個 Gate。下一個 Gate 不得消除、不得改寫，只能新增。
    2. 每個 warning 加 source_gate，並依「Gate 代號-流水號」編號，例如 G1-W01、G2-W03。
    3. 同一問題在不同 Gate 出現時，承接原 warning 編號，不另立新編號。
    4. 程式補回遺漏的 warning 時，須留稽核紀錄（遺漏的 Gate、warning 編號、補回時間）。稽核紀錄不屬 warning，不另編號。
  check_type: program
  source_section: '3'
  notes: ''
- id: C-R04
  title: 不推論、不合併、不跳步
  gate: C
  text: |-
    不得推論未明示的內容。不得合併不同事件、不同人物。不得跳過任何 Gate，除非依路由規則。
  check_type: llm
  source_section: '3'
  notes: ''
- id: C-R05
  title: UNKNOWN 保留
  gate: C
  text: |-
    UNKNOWN 代表資料不足，不得強制轉為 TRUE、FALSE、該當或不該當。NOT_APPLICABLE 代表不適用，與 UNKNOWN 不同。
  check_type: program
  source_section: '3'
  notes: ''
- id: C-R06
  title: 角色分流
  gate: C
  text: |-
    被害人端：只處理時、地、物、人、事，不處理主觀。
    涉嫌人端：處理人、事、時、地、物，加上刑法第 21～31 條與第 57 條。
    證人端：只提供事件過程內容，加強證據。
  check_type: llm
  source_section: '3'
  notes: ''
- id: C-R07
  title: 單一來源原則
  gate: C
  text: |-
    每個事實單元只在 Gate 1 產生一次。Gate 2、Gate 3 只引用 unit_id。若須引用內容，只引用欄位，不複製全文。
  check_type: program
  source_section: '3'
  notes: ''
- id: C-R08
  title: 角色設定
  gate: C
  text: |-
    本系統執行者設定為法律專家。所有判斷以中華民國（臺灣）法律為基準。所有輸出須區分：事實、法律候選、內部對應、不確定事項。
  check_type: manual
  source_section: '3'
  notes: 包含法律專家角色與法律基準，須由人工確認。
- id: C-R09
  title: STE100 規則
  gate: C
  text: |-
    本系統遵守 STE100：
    1. Simple：輸出簡明，不混雜無關判斷。
    2. Transparent：每個判斷標示依據。
    3. Evidence-based：以輸入事實與 source_raw 為限。
    4. 100% traceable：可回溯 unit_id、source_gate、warning。
    若使用者提供正式 STE100 定義，從其定義。
  check_type: manual
  source_section: '3'
  notes: 同時包含語意品質與可追溯性要求，無法以單一確定性檢查完整判定。
- id: C-R10
  title: 案件獨立原則
  gate: C
  text: |-
    每次案件都是新案件。不得沿用前案事實、人物、warning、法條候選或問句。除使用者明示同一案件外，一律從 Gate 1 重新開始。
  check_type: program
  source_section: '3'
  notes: ''
- id: C-R11
  title: Gate 凍結與不可回溯
  gate: C
  text: |-
    1. Gate 輸出經檢查合格並進入下一 Gate 後，即凍結。
    2. 後續 Gate 不得回頭修改前 Gate 的事實單元、案類候選、法條候選、問句或 warnings 原文。
    3. 發現前 Gate 缺漏或錯誤時，只能在當前 Gate 新增 warning。
    4. 若補充涉及前 Gate 事實，應終止流程，從 Gate 1 重新開始。
    5. 每個版本須有 version_id、parent_version_id。
  check_type: program
  source_section: '3'
  notes: ''
- id: C-R12
  title: 補充的範圍
  gate: C
  text: |-
    1. 補充僅能在當前 Gate 內進行，不得跨 Gate 回溯。
    2. 前 Gate 不合格，應在該 Gate 內補充後再進入下一 Gate。
    3. Gate 內補件（含補附通緝書）由同一 Gate 重新檢查，不開新版本。
    4. 進入下一 Gate 後才發現前 Gate 缺漏，不得回頭補，只能：當前 Gate 以 UNRESOLVED 或 warning 強行通過；或依 C-R11 第 4 點開新版本，從 Gate 1 重跑。
  check_type: program
  source_section: '3'
  notes: ''
- id: C-R13
  title: 版本控制
  gate: C
  text: |-
    同一案件每次重跑視為新版本，格式為 v1、v2、v3。新版本須從 Gate 1 重新開始，不得將新版本事實回寫舊版本。舊版本保留供追溯。
  check_type: program
  source_section: '3'
  notes: ''
- id: C-R14
  title: 規則與案例分離
  gate: C
  text: |-
    1. 規則條文不得包含具體案件事實、人物、地點、時間、罪名候選或問句。
    2. 模擬案例與測試紀錄僅供說明，不得寫入規則本體，不得作為其他案件之判斷依據。
    3. 規則與案例應分檔、分節、分版本。
  check_type: manual
  source_section: '3'
  notes: 同時包含檔案分離與內容是否屬具體案件的語意判斷。
- id: C-R15
  title: 日期與年次正規化
  gate: C
  text: |-
    1. 來源日期格式多樣（如「1214/0306」「114年01月17日」「0117/1828」「115年10月03日」）。統一輸出為「民國年／月／日 時分」，原文保留於 source_raw。
    2. 年份缺漏時，以報告日期之年份推定，並標示「推定」，加 warning。
    3. 年份與報告日期明顯不符，不自行修正，保留原文，加 warning，請承辦人確認。
    4. 年次以民國年次記錄，不自行換算西元。年齡推算須標示「推算」。
  check_type: manual
  source_section: '3'
  notes: 包含確定性日期格式及「明顯不符」的人工判斷。
- id: C-R16
  title: 人別比對
  gate: C
  text: |-
    1. 同一人在不同紀錄中之寫法（姓名部分遮蔽、代稱、僅有年次、代號、外文姓名）須以比對依據記錄。
    2. 比對依據包括：姓名、年次、車號、案號、證件號碼之部分資訊、聯絡方式等。外文姓名無年次者，以證件資訊之部分比對，不足時標 UNKNOWN。
    3. 同一紀錄內或跨紀錄之姓名近似（字形或字音相近但不同字，如「菜」與「蔡」）不得自行合併，須加 warning「姓名近似，待比對」。
    4. 依據不足時標 UNKNOWN，不得自行合併。比對結果記錄於 Gate 1，後續 Gate 不得變更。
    5. 比對無法確認者，保留為獨立單元，加 warning「人別待比對」。
  check_type: manual
  source_section: '3'
  notes: 人別比對須綜合多項識別資訊，且規則要求不足時保留人工確認。
- id: C-R17
  title: 個資最小化
  gate: C
  text: |-
    1. 身分證字號、電話、護照號碼、住址詳細資料、車號等，於條陳、問句與待辦清單輸出中僅保留必要部分，不得全文帶入。
    2. 條陳受理之案由、時地、物、人、事可保留必要識別；問句不得出現可直接識別之證件號碼或電話。
    3. 內部 source_raw 保留原文供追溯，但不得輸出至條陳、問句或待辦清單。
  check_type: manual
  source_section: '3'
  notes: 包含可程式遮罩欄位及「必要識別」範圍的人工判斷。
- id: C-R18
  title: 同一事件之報告版本
  gate: C
  text: |-
    1. 同一事件可能有初報、續報、結報、更正等多份報告。
    2. 每份報告記錄「報告階段」欄位。
    3. 以結報為準，前版保留供追溯。
    4. 同一事件的多份報告內容互相矛盾（如行駛方向、受損部位、時間），不得合併、不得自行採用其一，加 warning「報告內容矛盾，待比對」，並各自保留事實單元。
    5. 不同事件之判斷依時、地、人、物綜合比對，不得僅因案由相同即視為同一事件。
  check_type: llm
  source_section: '3'
  notes: ''
- id: C-R19
  title: 同一事件之重複報告
  gate: C
  text: |-
    同一時、地、車號或人別之報告，若內容高度重疊但報告人不同，標示「可能重複，待比對」，加 warning，不自行刪除任一份。
  check_type: llm
  source_section: '3'
  notes: ''
- id: C-R20
  title: 時序一致性檢核
  gate: C
  text: |-
    1. 每件報告須檢核時序：發生時間 ≤ 報案時間 ≤ 處理結果時間（破獲、查獲或受理）。
    2. 違反者不自行修正，保留原文，加 warning「時序不一致，待確認」。
    3. 同一事件之多個時間點（如交付時間與發現時間）須分開記錄，不得以單一時間取代。
  check_type: program
  source_section: '3'
  notes: ''
- id: C-R21
  title: 案號格式檢核
  gate: C
  text: |-
    1. 案號依常見格式檢核（如 Z 字開頭之 e 化案號、165 案號、婦幼案號、證明單號、通報案號等），格式不符者保留原文，加 warning「案號格式待確認」。
    2. 案號因排版斷行造成的分割，先合併後檢核，不得直接判定為格式不符。
    3. 案號格式清單另檔維護，不列於本手冊正文，並隨實務更新。
  check_type: manual
  source_section: '3'
  notes: 案號格式清單未載於手冊正文，無法只依本手冊完成確定性檢查。
- id: C-R22
  title: 法條資料表
  gate: C
  text: |-
    1. 本系統引用之所有法條，須載入法條資料表，欄位為：條次、條文原文、最重本刑、告訴乃論依據、追訴期間、來源、查證日期、最後修正日期、狀態、備註。
    2. 狀態值域為：「已確認」（有條文原文，且來源可追溯至官方法規資料庫或同等來源）、「判決書引用」（判決書中引用之條文，待補原文）、「二手來源」（僅有第二手資料，須補查原文）、「待查」（尚未取得）。
    3. 規則中引用之條文，若狀態非「已確認」，須於該規則標示，不得作為確定依據。
    4. 「已確認」僅適用於該條條文文字本身。條文未涵蓋的其他條次（如告訴乃論由他條規定者），須另以該他條判斷，不得以本條推定。
    5. 法條資料表擴充，依第 11 節程序進行。
  check_type: program
  source_section: '3'
  notes: ''
- id: G1-R01
  title: 結構完整
  gate: G1
  text: |-
    1. 被害單元：時、地、物、被害客體類型、人、報告人、事、是否有證人欄位皆存在。
    2. 行為單元：人、行為人類型、事、時、地、物、法條標示、刑法21～31、刑法57、是否有證人欄位皆存在。
    3. 證人陳述：有證人時，陳述內容、加強證據欄位存在；無證人時標 NOT_APPLICABLE。
    4. 程序與其他要件事實：第 6.5 節所列欄位皆存在。
    5. unit_id、source_raw、warnings 欄位存在。
    6. 無被害人之案件，被害單元標 NOT_APPLICABLE，不視為結構缺漏。

    合格則直接進入；不合格則補充後進入。
  check_type: program
  source_section: '6.4'
  notes: ''
- id: G1-R02
  title: 角色與行為人類型
  gate: G1
  text: |-
    1. 被害單元須有被害人、行為人欄位。被害人可為自然人或法人（見 4.1）。
    2. 行為單元須有涉嫌人欄位，並須標示行為人類型：自然人、法人或機關。
    3. 行為人為法人或機關者，刑法第 21～31 條與第 57 條之檢驗欄位標 NOT_APPLICABLE，並於 Gate 3 不產出涉嫌人問句（見 G3-R18）。
    4. 狀態值域為 RESOLVED、UNRESOLVED、NOT_APPLICABLE。
    5. UNRESOLVED 人物不得被合併。
    6. 同一自然人於不同事件中可分別為被害人或行為人，依行為分開建立單元，不得在同一單元內混用角色。
    7. 報告人與被害人不同時（如店長代為報案、特助代為報案），須分別記錄，不得以報告人取代被害人。
  check_type: program
  source_section: '6.4'
  notes: ''
- id: G1-R03
  title: 描述與來源品質
  gate: G1
  text: |-
    1. 行為、結果描述須為客觀事實，不得寫法律判斷。主觀欄位僅涉嫌人端處理。
    2. 法律判斷詞彙：
       - 罪名詞：詐欺、恐嚇、殺人、強制、背信、偽造文書等。
       - 法律定性詞：不法所有意圖、傷害故意、詐欺故意等。
       - 責任評價詞：正當防衛、緊急避難、故意、過失等。
       - 構成要件用語：竊取、竊盜、侵占、取走等，仍列為法律判斷詞。
    3. 不列入法律判斷詞：未結帳離去、拿取、帶走。
    4. 陳述來源為警方研判、推測或分析者，不得列為事實，加 warning「警方研判，非客觀事實」，保留原文。
    5. 每個事實單元須有 source_raw。

    不合格處理：含法律判斷詞彙、陳述來源為研判者，強行通過並加 warning；source_raw 為空或被害人端有主觀欄位者，補充後進入。
  check_type: llm
  source_section: '6.4'
  notes: ''
- id: G1-R04
  title: 事實分組合法
  gate: G1
  text: |-
    1. 同一單元內的行為，須滿足至少一項：同一行為人、同一被害人、時空密接、因果相連、目的同一。無上述關聯的行為不得放進同一單元。
    2. 有上述關聯的行為，依 G1-R06、G2-R14 仍須依人、依角色拆成多個單元。
    3. 不合格則要求重新分組。
  check_type: llm
  source_section: '6.4'
  notes: ''
- id: G1-R05
  title: 證據來源與保全
  gate: G1
  text: |-
    凡涉及物證（手機、影像、檔案、物品）或取證行為者，須記錄：物證名稱與數量、取得人、取得時間與地點、取得方式（扣押、交付、拾獲、自行取得、同意搜索等）、目前保管人、是否取得同意及同意範圍。無法確認者標 UNKNOWN，加 warning。取證程序合法性由使用者判斷，本 Gate 只記錄事實。
  check_type: program
  source_section: '6.4'
  notes: ''
- id: G1-R06
  title: 雙重身份與筆錄單元
  gate: G1
  text: |-
    1. 同一自然人同時為被害人與涉嫌人時，各自的行為分別建立單元。
    2. 每一個被害單元產出一份被害人筆錄；每一個行為單元產出一份涉嫌人筆錄（行為人為自然人者）。
    3. 份數依單元數量決定，不以人為單位。
    4. 每份筆錄只包含其對應單元的內容，跨份引用只能以 unit_id 作比對，不得將對方的主觀評價寫入己方筆錄。
    5. 每份筆錄各自保留 warning，並標註所屬單元與身份。
    6. 雙方互告各單元獨立判斷，不因對方提告而合併或停止。
  check_type: program
  source_section: '6.4'
  notes: ''
- id: G1-R07
  title: 互毆之客觀記錄
  gate: G1
  text: |-
    凡案情顯示雙方皆有攻擊行為，行為單元須記錄：先行出手者（依證據記載，或 UNKNOWN）、防衛情狀（對方有無現在不法侵害之記載，或 UNKNOWN）、反擊程度（客觀描述）、是否有證人或影像可佐證。本規則只記錄事實，不判斷是否成立正當防衛。
  check_type: manual
  source_section: '6.4'
  notes: 是否屬互毆及防衛情狀須依證據內容判斷，欄位完整性可程式檢查。
- id: G1-R08
  title: 路由判定
  gate: G1
  text: |-
    Gate 1 完成事實抽取後，依第 4.3 節判定路由。路由結果於 Gate 1 輸出，後續 Gate 不得變更。
  check_type: llm
  source_section: '6.4'
  notes: ''
- id: G1-R09
  title: 告訴期間與告訴狀態
  gate: G1
  text: |-
    1. 單一行為：自得為告訴之人知悉犯人時起算，六個月內為之（刑事訴訟法第 237 條第 1 項，已確認）。
    2. 連續或繼續行為：自知悉最後一次行為或行為終了時起算（大法官釋字第 108 號，已確認）。
    3. 發生時間不作為告訴期間之起算點。內部若需要「發生時間加六個月」之參考截止日，須另列欄位，標示「非法定起算點，僅供參考」。
    4. 起算點不明者，標 UNKNOWN，加 warning。
    5. 告訴狀態於 Gate 1 記錄，包括告訴權人與告訴意思。路由 B 因告訴而歸入者，告訴乃論與告訴期間於 Gate 1 標示，Gate 2 不適用（因路由 B 不經 Gate 2）。
    6. 本 Gate 不作正式期間計算結論，由使用者確認。
    7. 告訴乃論為「是」且知悉犯人時間已知時，可依刑事訴訟法第 237 條試算，標「非正式試算，供參考」。知悉時間為 UNKNOWN，或告訴乃論為「待查」者，不試算。
  check_type: manual
  source_section: '6.4'
  notes: 包含告訴乃論、起算點、期間試算及使用者確認。
- id: G1-R10
  title: 未確定被害人之單元
  gate: G1
  text: |-
    被害人身分未確定之物品或損害，建立未確定被害單元，被害人標 UNRESOLVED，不得以推測補入。Gate 2 標示待確認，不產出被害人問句。
  check_type: program
  source_section: '6.4'
  notes: ''
- id: G1-R11
  title: 報告版本與矛盾
  gate: G1
  text: |-
    依 C-R18 與 C-R19 處理。同一事件多份報告，記錄報告階段，以結報為準，前版保留；報告內容矛盾者各自保留事實單元並加 warning。
  check_type: llm
  source_section: '6.4'
  notes: ''
- id: G1-R12
  title: 程序時限（待查）
  gate: G1
  text: |-
    逮捕、解送、移送之時限須記錄於程序時限事實。法定時限之條文待查，確認前標 UNKNOWN，不得依經驗值判定是否逾時。
  check_type: program
  source_section: '6.4'
  notes: ''
- id: G1-R13
  title: 物品處置
  gate: G1
  text: |-
    扣案物或查扣物品須記錄處置方式與決定人。拋棄、廢棄、無法入庫之物品，須記錄處置依據。依據不明者標 UNKNOWN。
  check_type: program
  source_section: '6.4'
  notes: ''
- id: G1-R14
  title: 路由 B 之罪章、法條與通緝書
  gate: G1
  text: |-
    1. 路由 B 不經 Gate 2，罪章與法條於 Gate 1 標示，依事實內容與查獲內容，至條次為止；已知項、款者寫到項、款。
    2. 案由僅寫類別（如「公共危險」）而無法對應條次者，標 UNKNOWN，加 warning，不得由 Gate 3 自行推定。
    3. 通緝查獲案件必須附通緝書：若未附，Gate 1 處理結果為「補充後進入」，流程停止於 Gate 1，不輸出罪章候選，不進入 Gate 3。承辦人補附通緝書後，由 Gate 1 重新檢查。
    4. 通緝書所載罪名作為罪章來源，註明來源為通緝書。
    5. 條文狀態非「已確認」者，須標示其狀態（見 C-R22）。
  check_type: manual
  source_section: '6.4'
  notes: 罪章與條文對應涉及法律判斷，通緝書附件條件可程式檢查。
- id: G1-R15
  title: 追訴權標示
  gate: G1
  text: |-
    1. 追訴權依刑法第 80 條，以最重本刑對應之期間計算，自犯罪成立之日起算；犯罪行為有繼續狀態者，自行為終了之日起算（刑法第 80 條第 2 項，已確認）。
    2. 最重本刑由法條資料表取得。狀態非「已確認」者，追訴期間與追訴權狀態標 UNKNOWN，加 warning。
    3. 「發現時間」與「犯罪成立日」須分別記錄，發現時間不得取代犯罪成立日。
    4. 發生時間與犯罪成立日不同時（如交付時間與發現時間），以犯罪成立日為準，兩者皆須保留於事實單元。
    5. 追訴權狀態由 Gate 1 標示，路由 A 與路由 B 皆適用。Gate 2 與 Gate 3 只承接，不得重新判斷。
    6. 告訴期間與追訴權各自獨立判斷，任一逾期即需標示，不得以另一項之結果取代。
    7. 追訴權不得試算。法條狀態非「已確認」者只標 UNKNOWN。
    8. 犯罪成立日早於該條「最後修正日」者，加 warning「行為時法待查」。
  check_type: manual
  source_section: '6.4'
  notes: 追訴權涉及法律版本、犯罪成立日及人工確認，不能只以程式欄位檢查。
- id: G1-R16
  title: 行政裁處時效與最小紀錄
  gate: G1
  text: |-
    路由 E 之案件，須記錄違反行為成立日，並依各行政法規之時效規定標示：
    1. 社會秩序維護法第 31 條：違反本法行為逾二個月者，警察機關不得訊問、處罰，並不得移送法院，期間自違反行為成立之日起算，但行為有連續或繼續狀態者，自行為終了之日起算（已確認）。
    2. 道路交通管理處罰條例之時效條文：待查，確認前標 UNKNOWN，加 warning。
    3. 行政時效逾期者，標示「行政時效已逾」，加 warning，不得以行政裁處作成結論。
    4. 路由 E 最小紀錄須含：路由、unit_id、案號、所別、違反行為成立日、時效標示、warning、source_raw。不產出問句與條陳。
  check_type: manual
  source_section: '6.4'
  notes: 行政裁處時效涉及法規完整性與人工法律確認。
- id: G1-R17
  title: 管轄與轄區外受理
  gate: G1
  text: |-
    1. 犯罪地不屬本所轄區，或受理機關與管轄機關不一致者，於管轄事實標示。
    2. 轄區外受理之案件，仍依路由建立事實單元，保留供追溯。
    3. 轄區外案件不得以本所名義產出條陳，標示「建議移送」，加 warning，由受理人員決定移送。
    4. 受理與管轄不一致不影響路由判斷，但須於 Gate 2、Gate 3 之 warning 中承接。
  check_type: manual
  source_section: '6.4'
  notes: 管轄與移送建議涉及案件事實及人工決定。
- id: G1-R18
  title: 路由 C、D 之刑事內容提示
  gate: G1
  text: |-
    路由 C、D 中，事實含刑事行為且屬備案者，依 G1-R22 列入承辦人待辦清單。非備案之路由 C 或 D 案件，若事實含刑事行為，僅記錄提示，加 warning，不產出任何刑事單元。
  check_type: llm
  source_section: '6.4'
  notes: ''
- id: G1-R19
  title: 所別來源判定
  gate: G1
  text: |-
    1. 所別來源依序為：報告抬頭、報告單位欄位、發送單位。依序取第一個可判定者，並於 6.5 所別來源欄記錄來源。
    2. 三者皆無法判定者，所別標 UNKNOWN，加 warning。
  check_type: program
  source_section: '6.4'
  notes: ''
- id: G1-R20
  title: 路由 B 之相關罪章檢核
  gate: G1
  text: |-
    1. 路由 B 不經 Gate 2，相關罪章檢核（G2-R10）須於 Gate 1 執行。
    2. 檢核範圍與 G2-R10 相同：刑法內部之想像競合、數罪併罰；以及特別法清單（洗錢防制法、毒品危害防制條例、家庭暴力防治法、兒童及少年性剝削防制條例、個人資料保護法、詐欺犯罪危害防制條例）。
    3. 檢核結果為「無」者註明「經檢核無相關罪章」；不足以判斷者標 UNKNOWN，加 warning。
    4. 本規則只列候選，不作成立與否之判斷。清單以外之特別法由使用者另行判斷。
    5. 檢核結果於 6.5「相關罪章檢核」欄記錄，Gate 3 承接，不得重新檢核。
  check_type: manual
  source_section: '6.4'
  notes: 相關罪章與特別法候選屬法律判斷。
- id: G1-R21
  title: 案由與事實不一致
  gate: G1
  text: |-
    1. 路由以事實內容為準，案由僅作參考。
    2. 報告案由為非刑事類別（如「糾紛」「其他案類」「其他」「為民服務」）但事實內容含刑事行為者，加 warning「案由與事實不一致」，並依事實內容與 G1-R20 判定路由。
    3. 報告案由為刑事類別但事實內容不含刑事行為者，加 warning「案由與事實不一致」，依事實內容判定路由；事實內容不明者標 UNKNOWN，不得歸入 A 或 B。
    4. 案由與事實不一致之記錄於 6.5「案由與事實一致性」欄，Gate 2 與 Gate 3 承接，不得自行改寫案由。
    5. 條陳案由依 G2-R07 由案類候選產出，不得沿用報告原案由。
  check_type: llm
  source_section: '6.4'
  notes: ''
- id: G1-R22
  title: 承辦人待辦清單
  gate: G1
  text: |-
    1. 路由 C 或 D 之備案，事實含刑事行為者，Gate 1 須產出承辦人待辦清單，不得僅以 warning 提示。
    2. 待辦清單每筆記錄：案號（無案號者標 UNKNOWN）、報告日期、報告單位、案由、刑事內容摘要（依 C-R17 精簡）、來源 unit_id、路由結果。
    3. 待辦清單隨路由結果一併輸出，與 Gate 1 之其他輸出同時產生。
    4. 待辦清單不產出案類、法條、問句或條陳，僅供承辦人判斷是否另行受理。
    5. 待辦清單之項目須依序編號，並於 6.5「承辦人待辦」欄註明是否列入。
  check_type: program
  source_section: '6.4'
  notes: ''
- id: G1-R23
  title: 家暴通報與保護令分流
  gate: G1
  text: |-
    1. 家暴通報、聲請保護令、傷害告訴可能同時存在於同一事件。
    2. 通報與保護令各自記錄為受理性質，不視為告訴。
    3. 同時有傷害告訴者，傷害部分依事實與被害人走路由 A，其餘依性質記錄。
    4. 家暴通報或保護令本身無刑事內容者，依路由 C 或 D 處理，不產出刑事單元。
  check_type: manual
  source_section: '6.4'
  notes: 家暴通報、保護令及傷害告訴的分流涉及事實與程序性質判斷。
- id: G1-R24
  title: 性騷擾申訴
  gate: G1
  text: |-
    1. 性騷擾申訴記為獨立的行政調查紀錄，不走路由 E，不產出案類與問句。
    2. 紀錄欄位：案號、受理單位、申訴人、行為人（不明標 UNRESOLVED）、事件發生日、知悉日、申訴時限（原文待查，確認前標 UNKNOWN）、警方受理依據。
    3. 事實含性騷擾防治法第 25 條之罪者，另建刑事單元，依 4.3 判定路由 A 或 B，告訴乃論標「待查」。
    4. 申訴與刑事告訴分別記錄，申訴不視為告訴。
  check_type: manual
  source_section: '6.4'
  notes: 性騷擾行政申訴與刑事單元分流涉及法律與事實判斷。
