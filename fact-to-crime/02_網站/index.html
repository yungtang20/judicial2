<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>警詢筆錄 AI 輔助產出系統</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif; background: #f5f5f5; color: #2c3e50; }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
  header { background: #2c3e50; color: #fff; padding: 18px 24px; border-radius: 10px; margin-bottom: 20px; }
  header h1 { font-size: 22px; font-weight: 600; }
  header .sub { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card h2 { font-size: 16px; margin-bottom: 12px; color: #2c3e50; border-left: 4px solid #2c3e50; padding-left: 10px; }
  .radio-group { display: flex; flex-wrap: wrap; gap: 10px; }
  .radio-group label { background: #f0f3f6; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; border: 1px solid transparent; }
  .radio-group label:has(input:checked) { background: #2c3e50; color: #fff; border-color: #2c3e50; }
  .radio-group input { margin-right: 6px; }
  textarea { width: 100%; min-height: 120px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; }
  textarea:focus { outline: 2px solid #2c3e50; }
  .btn { background: #2c3e50; color: #fff; border: none; padding: 10px 22px; border-radius: 8px; font-size: 15px; cursor: pointer; margin-right: 10px; margin-top: 12px; }
  .btn:hover { background: #34495e; }
  .btn.secondary { background: #7f8c8d; }
  .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
  #loading { text-align: center; padding: 20px; color: #7f8c8d; display: none; }
  #error-box { background: #fdecea; color: #c0392b; border: 1px solid #e74c3c; border-radius: 8px; padding: 12px; margin-bottom: 14px; display: none; font-size: 14px; }
  .section-title { font-size: 15px; font-weight: 600; margin: 16px 0 8px; color: #2c3e50; }
  .q-item { background: #fafbfc; border: 1px solid #e8ecf0; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 14px; }
  .q-item .q { font-weight: 500; }
  .q-item .a { color: #95a5a6; margin-top: 4px; min-height: 18px; border-top: 1px dashed #e0e5e9; padding-top: 4px; }
  .q-item .meta { font-size: 11px; color: #95a5a6; margin-top: 4px; }
  .q-item.optional .q::before { content: "[可選] "; color: #e67e22; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { border: 1px solid #e0e5e9; padding: 7px 10px; text-align: left; }
  th { background: #f0f3f6; }
  .badge { display: inline-block; background: #eaf2f8; color: #2c3e50; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 4px; }
  .badge.warn { background: #fef5e7; color: #d35400; }
  .badge.err { background: #fdecea; color: #c0392b; }
  ul.warnings { font-size: 13px; margin-left: 20px; }
  ul.warnings li { margin-bottom: 4px; }
  .stage-label { display: inline-block; font-size: 11px; background: #2c3e50; color: #fff; padding: 1px 7px; border-radius: 4px; margin-right: 6px; }
  .export-area { display: none; }
  @media (max-width: 768px) {
    .container { padding: 10px; }
    .card { padding: 14px; }
    header h1 { font-size: 18px; }
  }
  @media print {
    body { background: #fff; }
    .card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
    .btn, #step1, #step2, #step3 { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>警詢筆錄 AI 輔助產出系統</h1>
    <div class="sub">事實→元件→罪名 比對引擎（v15，17 層）｜LLM 不直接輸出罪名（R30）｜問句僅供偵查參考</div>
  </header>

  <div id="error-box"></div>
  <div id="loading">載入中……（讀取 15 個罪章資料）</div>

  <div id="main" style="display:none;">
    <!-- 步驟一：選角色 -->
    <div class="card" id="step1">
      <h2>步驟一：選受詢問人身分</h2>
      <div class="radio-group" id="role-group"></div>
    </div>

    <!-- 步驟二：選罪章 -->
    <div class="card" id="step2">
      <h2>步驟二：選罪章族群</h2>
      <div class="radio-group" id="chapter-group"></div>
    </div>

    <!-- 步驟三：輸入案情 -->
    <div class="card" id="step3">
      <h2>步驟三：輸入案情（LINE 陳報文本）</h2>
      <textarea id="case-text" placeholder="貼上 LINE 陳報檔文本或輸入案情摘要……&#10;&#10;例：報案人稱於超商內發現一名男子將商品放入背包未結帳即離開，現場監視器已調閱。"></textarea>
      <button class="btn" id="btn-run">產出問句（Ctrl+Enter）</button>
      <button class="btn secondary" id="btn-clear">清空</button>
    </div>

    <!-- 步驟四：產出結果 -->
    <div class="card" id="step4" style="display:none;">
      <h2>步驟四：產出結果</h2>

      <div id="result-summary"></div>
      <div id="result-layers"></div>
      <div id="result-charges"></div>
      <div id="result-questions"></div>

      <button class="btn" id="btn-copy">複製全文</button>
      <button class="btn secondary" id="btn-export">匯出 .txt</button>
      <button class="btn secondary" id="btn-print">列印</button>
      <pre id="export-area" class="export-area"></pre>
    </div>
  </div>
</div>

<script>
// 瀏覽器環境：全部引擎邏輯內嵌（不載入 Node module.exports 檔案，避免 require 錯誤）
// question_library.js 有 module.exports，改用 fetch JSON 轉換
</script>
<script>
(function() {
  'use strict';

  // ===== 引擎核心邏輯（內嵌瀏覽器版）=====
  // 12/13 層：罪名比對（複製 rule_engine.js 核心邏輯）
  function normalizeStatus(st) {
    if (!st) return '資料不足';
    if (st.status === '推論符合' && (!st.source_raw || st.source_raw.length === 0)) return '資料不足';
    return st.status || '資料不足';
  }
  function isPositive(st) { return st === '符合' || st === '推論符合'; }

  function chargeHolds(charge, stateMap) {
    for (const eid of (charge.requires_elements || [])) {
      if (!isPositive(normalizeStatus(stateMap[eid]))) return false;
    }
    for (const gid of Object.keys(charge.requires_one_of || {})) {
      const cands = charge.requires_one_of[gid] || [];
      if (!cands.some(eid => isPositive(normalizeStatus(stateMap[eid])))) return false;
    }
    const anyResult = charge.requires_any_result || [];
    if (anyResult.length > 0) {
      if (!anyResult.some(eid => isPositive(normalizeStatus(stateMap[eid])))) return false;
    }
    for (const eid of (charge.requires_all_optional || [])) {
      if (!isPositive(normalizeStatus(stateMap[eid]))) return false;
    }
    const notAll = charge.requires_not_all || [];
    if (notAll.length > 0) {
      if (notAll.some(eid => isPositive(normalizeStatus(stateMap[eid])))) return false;
    }
    for (const eid of (charge.not_applicable_if || [])) {
      if (isPositive(normalizeStatus(stateMap[eid]))) return false;
    }
    return true;
  }

  // 案情→stateMap 映射（前端骨架：關鍵詞情境比對；正式抽取由 LLM 責任）
  // 情境詞庫：依元件 id 比對案情中的關鍵詞
  // 案情→stateMap 映射（R5/8A 修正版）
  // 前端不做關鍵詞判定——案情文本不是證據，沒有真實來源（筆錄/監視器/物證）一律「資料不足」。
  // 正式映射由 LLM 依第 4 層抽取（附 source_raw）或人工提供 state_map。
  function mapTextToState(text, elements) {
    const stateMap = {};
    for (const el of (elements.elements || [])) {
      stateMap[el.id] = {
        status: '資料不足',
        source_raw: [],
        source_type: '被害人陳述',
        source_count: 0,
      };
    }
    return stateMap;
  }

  window.__ruleEngineRun = function(chapterId, ch, text) {
    let stateMap = mapTextToState(text, ch.elements);

    // R24/限制14：計算前剔除無證據能力的來源（evidence_admissibility === '排除' 或未審查者）
    const evidenceWarnings = [];
    for (const [eid, ev] of Object.entries(stateMap)) {
      const adm = ev.evidence_admissibility;
      if (adm === '排除' || !adm) {
        evidenceWarnings.push({ element: eid, message: '⚠️ R24：證據能力未審查或被排除，不得作為判斷依據（刑訴§155②）' });
        stateMap[eid] = { status: '資料不足', source_raw: [], source_type: ev.source_type, source_count: 0 };
      }
    }

    // 12A 候選罪名
    const candidates = [];
    for (const c of ch.charges.charges) {
      if (c.is_variant_of) continue;
      if (chargeHolds(c, stateMap)) candidates.push(c.id);
    }

    // 12B 反證自檢（R18/R31）：逐一移除必要元件重算，未降級者移出候選
    const verifiedCandidates = [];
    const counterEvidence = {};
    for (const cid of candidates) {
      const charge = ch.charges.charges.find(c => c.id === cid);
      const necessary = [...(charge.requires_elements || []), ...(charge.requires_all_optional || [])];
      const failures = [];
      for (const eid of necessary) {
        const mutated = Object.assign({}, stateMap, { [eid]: { status: '不符合', source_raw: [], source_count: 0 } });
        if (chargeHolds(charge, mutated)) failures.push(eid);
      }
      counterEvidence[cid] = { necessary_elements: necessary, failures, has_doubt: failures.length > 0 };
      if (failures.length === 0) verifiedCandidates.push(cid);
    }

    // 13 互斥：special_over_general
    for (const ex of (ch.exclusions.exclusions || [])) {
      if (ex.type !== 'statute_competition_special_general') continue;
      const special = ex.special_over_general;
      if (verifiedCandidates.includes(special)) {
        const generals = (ex.between_charges || []).filter(id => id !== special);
        for (const g of generals) {
          const idx = verifiedCandidates.indexOf(g);
          if (idx >= 0) verifiedCandidates.splice(idx, 1);
        }
      }
    }

    // 8A 狀態判定：可能涉及 / 資料不足 / not_charged
    const chargeStates = {};
    for (const c of ch.charges.charges) {
      if (c.is_variant_of) continue;
      if (chargeHolds(c, stateMap)) {
        chargeStates[c.id] = '可能涉及';
      } else {
        // 檢查原因：必要元件有不符→not_charged；資料不足→資料不足
        const required = [...(c.requires_elements || []), ...(c.requires_all_optional || [])];
        let anyNeg = false, anyIns = false;
        for (const eid of required) {
          const st = normalizeStatus(stateMap[eid]);
          if (st === '不符合') anyNeg = true;
          if (st === '資料不足') anyIns = true;
        }
        for (const gid of Object.keys(c.requires_one_of || {})) {
          const cands = c.requires_one_of[gid] || [];
          if (!cands.some(eid => isPositive(normalizeStatus(stateMap[eid])))) {
            if (cands.some(eid => normalizeStatus(stateMap[eid]) === '資料不足')) anyIns = true;
          }
        }
        chargeStates[c.id] = anyNeg ? 'not_charged' : (anyIns ? '資料不足' : 'not_charged');
      }
    }

    // R43：法人警告（依 stateMap 的 actor_subject_type）
    const actorWarnings = [];
    for (const c of ch.charges.charges) {
      if (!c.actor_subject_type_required) continue;
      for (const eid of (c.requires_elements || [])) {
        const el = (ch.elements.elements || []).find(e => e.id === eid);
        const stateActor = stateMap[eid] && stateMap[eid].actor_subject_type;
        const actorType = stateActor || (el && el.actor_subject_type);
        if (actorType === '法人' && c.actor_subject_type_required === '自然人') {
          actorWarnings.push({ charge: c.id, element: eid, message: '⚠️ R43：法人不得作為行為人元件，需追問實際行為之自然人' });
        }
      }
    }

    const openConstitution = (ch.elements.elements || [])
      .filter(e => e.constitution_type === '開放')
      .map(e => ({ element_id: e.id, element_name: e.name, key_doctrines: e.key_doctrines || [], message: '待法官補充（開放構成要件）' }));

    return { candidate_charges: verifiedCandidates, charge_states: chargeStates, counter_evidence: counterEvidence, open_constitution: openConstitution, actor_warnings: actorWarnings, evidence_warnings: evidenceWarnings };
  };

  // 16 層：問句（混合方案 C，內嵌 question_library）
  let QLIB = null;
  window.__loadQuestionLibrary = async function() {
    const res = await fetch('../01_規則/question_library.js');
    const src = await res.text();
    // 執行 module.exports → 提取物件
    const fn = new Function(src.replace(/module\.exports\s*=\s*/, 'return '));
    QLIB = fn();
    return QLIB;
  };

  window.__questionEngineRun = function(chapterId, ch, text, identity) {
    if (!QLIB) return [];
    const out = [];
    const seen = new Set();
    const processedElements = new Set();
    const processedGroups = new Set();
    const stateMap = mapTextToState(text, ch.elements);

    function push(q, extra) {
      if (!q.identity_sensitive || !q.identity_sensitive.includes(identity)) return;
      const key = q.stage + ':' + q.text;
      if (seen.has(key)) return;
      seen.add(key);
      out.push(Object.assign({}, q, extra || {}));
    }

    // A 自由陳述
    for (const q of (QLIB.common.free_statement || [])) push(q, { generated_by: 'rule_library', bound_element: null });
    // E 證據保全
    for (const q of (QLIB.common.evidence_preservation || [])) push(q, { generated_by: 'rule_library', bound_element: null });
    // B 缺口聚焦
    for (const charge of ch.charges.charges) {
      for (const eid of (charge.requires_elements || [])) {
        if (processedElements.has(eid)) continue;
        processedElements.add(eid);
        if (isPositive(normalizeStatus(stateMap[eid]))) continue;
        const chLib = QLIB.chapters[chapterId];
        const qs = (chLib && chLib[charge.id] && chLib[charge.id].element_questions && chLib[charge.id].element_questions[eid]) || [];
        for (const q of qs) push(q, { generated_by: 'rule_library', bound_element: eid, bound_charge: charge.id });
        if (qs.length === 0) {
          push({ stage: 'B', priority: 5, type: '開放', text: '（LLM 依 v15 措辭規則生成，針對元件 ' + eid + '）', identity_sensitive: [identity], neutral: true }, { generated_by: 'llm', bound_element: eid, bound_charge: charge.id });
        }
      }
      for (const [gid, cands] of Object.entries(charge.requires_one_of || {})) {
        if (processedGroups.has(gid)) continue;
        processedGroups.add(gid);
        if (cands.some(eid => isPositive(normalizeStatus(stateMap[eid])))) continue;
        const chLib = QLIB.chapters[chapterId];
        for (const eid of cands) {
          const qs = (chLib && chLib[charge.id] && chLib[charge.id].element_questions && chLib[charge.id].element_questions[eid]) || [];
          for (const q of qs) push(q, { generated_by: 'rule_library', bound_element: eid, bound_charge: charge.id, bound_group: gid });
        }
      }
    }
    // C 結尾開放
    for (const q of (QLIB.common.open_ending || [])) push(q, { generated_by: 'rule_library', bound_element: null });

    // 排序
    const stageOrder = { A: 0, E: 1, B: 2, C: 3 };
    out.sort((a, b) => (stageOrder[a.stage] - stageOrder[b.stage]) || ((a.priority || 5) - (b.priority || 5)));
    return out;
  };

  // ===== 狀態 =====
  const state = {
    chapters: {},       // chapter_id -> {elements, charges, exclusions}
    role: null,
    chapter: null,
    lastOutput: null,
  };
  const ROLES = ['被害人', '被告', '證人', '關係人'];

  // ===== 工具 =====
  function $(id) { return document.getElementById(id); }
  function showError(msg) {
    const box = $('error-box');
    box.textContent = msg;
    box.style.display = 'block';
    $('main').style.display = 'none';
  }
  function clearError() { $('error-box').style.display = 'none'; }

  // ===== 載入全部罪章 =====
  async function loadAll() {
    try {
      const res = await fetch('../00_資料/罪章/');
      // fetch 目錄清單不一定可用；改用已知 15 章
      const known = ['criminal_221','criminal_computer','criminal_defame','criminal_drugs','criminal_forgery','criminal_fraud','criminal_gambling','criminal_harm_dv','criminal_intimidation','criminal_obscenity','criminal_public_danger','criminal_robbery','criminal_sexual_harassment','criminal_theft_embezzle','criminal_traffic'];
      for (const ch of known) {
        const [els, chs, exs] = await Promise.all([
          fetch(`../00_資料/罪章/${ch}/elements.json`).then(r => r.json()),
          fetch(`../00_資料/罪章/${ch}/charges.json`).then(r => r.json()),
          fetch(`../00_資料/罪章/${ch}/exclusions.json`).then(r => r.json()),
        ]);
        state.chapters[ch] = { elements: els, charges: chs, exclusions: exs };
      }
      // 載入 question_library（16 層問句引擎需要）
      await window.__loadQuestionLibrary();
      $('loading').style.display = 'none';
      $('main').style.display = 'block';
      renderRoles();
    } catch (e) {
      $('loading').style.display = 'none';
      showError('載入失敗：' + e.message + '。請用本地伺服器開啟（bash 03_轉換工具/serve.sh），或將 JSON 改為內嵌。');
    }
  }

  // ===== 渲染 =====
  function renderRoles() {
    const g = $('role-group');
    g.innerHTML = ROLES.map(r =>
      `<label><input type="radio" name="role" value="${r}">${r}</label>`).join('');
    g.addEventListener('change', e => {
      state.role = e.target.value;
      renderChapters();
    });
  }

  function renderChapters() {
    const g = $('chapter-group');
    const names = Object.entries(state.chapters).map(([id, d]) => [id, d.elements.chapter_name || id]);
    g.innerHTML = names.map(([id, name]) =>
      `<label><input type="radio" name="chapter" value="${id}">${name.replace('族群', '')}</label>`).join('');
    g.addEventListener('change', e => { state.chapter = e.target.value; });
  }

  // ===== 核心：跑 17 層 =====
  async function run() {
    if (!state.role) { alert('請先選受詢問人身分'); return; }
    if (!state.chapter) { alert('請先選罪章族群'); return; }
    const text = $('case-text').value.trim();
    if (!text) { alert('請輸入案情'); return; }

    clearError();
    const ch = state.chapters[state.chapter];

    // 1A 身分判定 + 2A 分流（簡化：前端不跑 layers.js，直接用選擇值）
    const primaryIdentity = state.role;

    // 12/13 層：罪名比對（複製 rule_engine 核心邏輯，純前端）
    const ruleResult = window.__ruleEngineRun(state.chapter, ch, text);

    // 16 層：問句（混合方案 C）
    const questions = window.__questionEngineRun(state.chapter, ch, text, primaryIdentity);

    // 輸出
    state.lastOutput = { ruleResult, questions, chapter: state.chapter, role: primaryIdentity, text };
    renderResult();
  }

  function renderResult() {
    const { ruleResult, questions, chapter, role, text } = state.lastOutput;
    const ch = state.chapters[chapter];

    // 摘要
    $('result-summary').innerHTML = `
      <div><span class="badge">角色：${role}</span><span class="badge">罪章：${ch.elements.chapter_name || chapter}</span></div>`;

    // 罪名浮現
    const cs = ruleResult.charge_states || {};
    const cands = ruleResult.candidate_charges || [];
    let chargesHtml = '<div class="section-title">罪名浮現（12A+12B，R30：由規則計算）</div>';
    chargesHtml += '<table><tr><th>罪名</th><th>條號</th><th>狀態</th></tr>';
    for (const c of ch.charges.charges) {
      if (c.is_variant_of) continue;
      const st = cs[c.id] || '資料不足';
      const cls = st === '可能涉及' ? '' : (st === '資料不足' ? 'warn' : 'err');
      chargesHtml += `<tr><td>${c.name}</td><td>${c.article}</td><td><span class="badge ${cls}">${st}</span></td></tr>`;
    }
    chargesHtml += '</table>';
    if (ruleResult.open_constitution?.length > 0) {
      chargesHtml += '<div class="section-title">開放構成要件（6C/R21）</div><ul class="warnings">';
      for (const oc of ruleResult.open_constitution) {
        chargesHtml += `<li>${oc.element_name}：${oc.message}</li>`;
      }
      chargesHtml += '</ul>';
    }
    if (ruleResult.actor_warnings?.length > 0) {
      chargesHtml += '<div class="section-title">R43 法人警告</div><ul class="warnings">';
      for (const aw of ruleResult.actor_warnings) chargesHtml += `<li>${aw.message}</li>`;
      chargesHtml += '</ul>';
    }
    $('result-charges').innerHTML = chargesHtml;

    // 問句（三段結構）
    const stageNames = { A: '自由陳述段', E: '證據保全段', B: '缺口聚焦段', C: '結尾開放段' };
    let qHtml = `<div class="section-title">S-11 問句佇列（${questions.length} 題，混合方案 C）</div>`;
    let lastStage = null;
    for (const q of questions) {
      if (q.stage !== lastStage) {
        qHtml += `<div class="section-title"><span class="stage-label">${stageNames[q.stage] || q.stage}</span></div>`;
        lastStage = q.stage;
      }
      const opt = q.generated_by === 'llm' ? 'optional' : '';
      qHtml += `<div class="q-item ${opt}">
        <div class="q">${q.type === '封閉' ? '〔確認〕' : ''}${q.text}</div>
        <div class="a">答：</div>
        <div class="meta">${q.generated_by === 'llm' ? '[LLM 生成，可調整]' : '[規則庫]'} ${q.bound_element ? '綁定 ' + q.bound_element : ''}</div>
      </div>`;
    }
    $('result-questions').innerHTML = qHtml;

    $('step4').style.display = 'block';
    $('step4').scrollIntoView({ behavior: 'smooth' });
  }

  // ===== 匯出/複製 =====
  function buildText() {
    const { ruleResult, questions, chapter, role, text } = state.lastOutput;
    const ch = state.chapters[chapter];
    const lines = [];
    lines.push('一、案件內容');
    lines.push(text);
    lines.push('');
    lines.push('二、角色與版本');
    lines.push(`角色：${role}`);
    lines.push(`罪章：${ch.elements.chapter_name || chapter}`);
    lines.push('');
    lines.push('三、罪名浮現（R30：由規則計算）');
    for (const c of ch.charges.charges) {
      if (c.is_variant_of) continue;
      lines.push(`- ${c.name}（${c.article}）：${ruleResult.charge_states?.[c.id] || '資料不足'}`);
    }
    lines.push('');
    lines.push('四、S-11 問句佇列');
    const stageNames = { A: 'A 自由陳述段', E: 'E 證據保全段', B: 'B 缺口聚焦段', C: 'C 結尾開放段' };
    let lastStage = null;
    for (const q of questions) {
      if (q.stage !== lastStage) { lines.push(''); lines.push(`─── ${stageNames[q.stage] || q.stage} ───`); lines.push(''); lastStage = q.stage; }
      lines.push(`問：${q.text}`);
      lines.push('答：');
      if (q.generated_by === 'llm') lines.push('[LLM 生成，可調整]');
    }
    return lines.join('\n');
  }

  // ===== 事件綁定 =====
  $('btn-run').addEventListener('click', run);
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') run();
  });
  $('btn-clear').addEventListener('click', () => { $('case-text').value = ''; });
  $('btn-copy').addEventListener('click', async () => {
    const t = buildText();
    try { await navigator.clipboard.writeText(t); alert('已複製'); }
    catch (e) { $('export-area').textContent = t; $('export-area').style.display = 'block'; alert('剪貼簿不可用，已顯示全文請手動複製'); }
  });
  $('btn-export').addEventListener('click', () => {
    const t = buildText();
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const fname = `筆錄問句_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.txt`;
    const blob = new Blob([t], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    a.click();
  });
  $('btn-print').addEventListener('click', () => window.print());

  // ===== 啟動 =====
  loadAll();
})();
</script>
</body>
</html>
